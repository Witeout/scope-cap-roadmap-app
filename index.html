<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scope Cap Roadmap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        'surface-container-lowest':'#ffffff',
        'surface-container-low':'#f5f4ed',
        'surface-container':'#efeee6',
        'surface-container-high':'#e8e7df',
        'surface-container-highest':'#c5c6bb',
        'on-background':'#31332c','on-surface':'#31332c',
        'on-surface-variant':'#5e6058',
        'surface-variant':'#c5c6bb','surface-tint':'#5b5f63',
        primary:'#5b5f63','primary-dim':'#4a4e52',
        'primary-fixed':'#c5c6bb','primary-fixed-dim':'#a5a6a0',
        'on-primary':'#f5f8fd','on-primary-fixed':'#000000',
        'on-primary-fixed-variant':'#3d4043','on-primary-container':'#21272b',
        'primary-container':'#c5c6bb',
        'inverse-primary':'#a5a6a0',
        secondary:'#57634c','secondary-dim':'#4a553f',
        'secondary-fixed':'#d1dfc2','secondary-fixed-dim':'#bfceb0',
        'secondary-container':'#dae7ca',
        'on-secondary':'#e8f0dd','on-secondary-fixed':'#3a4530',
        'on-secondary-fixed-variant':'#57634c',
        'on-secondary-container':'#4a553f',
        tertiary:'#7a583d','tertiary-dim':'#6b4a30',
        'tertiary-fixed':'#e5b898','tertiary-fixed-dim':'#d4a07c',
        'tertiary-container':'#e5b898',
        'on-tertiary':'#f7ede4','on-tertiary-fixed':'#2e1600',
        'on-tertiary-fixed-variant':'#5a3d22',
        'on-tertiary-container':'#4a2e12',
        outline:'#7b7d73','outline-variant':'#b1b3a9',
        error:'#9f403d','error-dim':'#8a3330',
        'error-container':'#f7b8b6',
        'on-error':'#ffefee','on-error-container':'#4a1a18',

      fontFamily: { "headline":["Manrope"], "body":["Manrope"], "label":["Manrope"] },

<style>
.material-symbols-outlined {
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  vertical-align: middle; line-height: 1;
}
body { font-family:'Manrope',sans-serif; }
h1,h2,h3,.font-headline { font-family:'Manrope',sans-serif; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#c5c6bb; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:#b1b3a9; }

/* ── DnD Indicators ── */
.drop-above { position:relative; }
.drop-above::before { content:''; position:absolute; top:-1px; left:0; right:0; height:2px; background:#5b5f63; z-index:10; border-radius:1px; }
.drop-below { position:relative; }
.drop-below::after  { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:#5b5f63; z-index:10; border-radius:1px; }
.drop-inside { outline:2px dashed #5b5f63 !important; outline-offset:-2px; background:rgba(91,95,99,.06) !important; }
.dragging { opacity:.35 !important; }

/* ── Panel ── */
#panel { transition:transform .22s ease; }

/* ── Sidebar ── */
#sidebar { width:240px; transition:width .22s ease; overflow:hidden; }
#sidebar.sidebar-collapsed { width:52px; }
#sidebar.sidebar-collapsed .sb-text { display:none; }
#sidebar.sidebar-collapsed .sb-header { justify-content:center; gap:0; padding:0.75rem 0.25rem; }
#sidebar.sidebar-collapsed nav button,
#sidebar.sidebar-collapsed nav a { justify-content:center; gap:0; padding:0.5rem 0; border-left:none !important; box-shadow:none !important; }
#sidebar.sidebar-collapsed .sb-bottom-actions { justify-content:center; gap:0; padding:0.5rem 0; }
#sidebar.sidebar-collapsed .sb-toggle-icon { transform:rotate(180deg); }

/* ── Sprint drop zone ── */
.sprint-drop-zone { padding:10px 16px 10px 52px; font-size:13px; color:#b1b3a9; font-style:italic; background:white; border-bottom:1px solid #f0efe7; }
.sprint-drop-zone.drag-active { background:rgba(91,95,99,.04); color:#5b5f63; outline:2px dashed #5b5f63; outline-offset:-2px; }

/* ── Context Menu ── */
#ctx-menu {
  position:fixed; background:white; border:1px solid #dfe1e6; border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,0.16); z-index:9999; min-width:240px; overflow:hidden; padding:4px 0;
  font-family:'Manrope',sans-serif;
}
.ctx-header { padding:7px 14px 5px; font-size:10px; font-weight:700; color:#6b6d63; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid #f4f5f7; margin-bottom:3px; }
.ctx-sprint-list { max-height:280px; overflow-y:auto; }
.ctx-item { display:flex; align-items:center; gap:10px; padding:7px 14px; font-size:13px; color:#31332c; cursor:pointer; transition:background .08s; }
.ctx-item:hover { background:#f0efe7; }
.ctx-item.ctx-active { background:#efeee6; font-weight:600; color:#5b5f63; }
.ctx-item.ctx-active::after { content:'✓'; margin-left:auto; font-size:12px; }
.ctx-sprint-label { font-weight:600; }
.ctx-sprint-dates { font-size:11px; color:#9e9f95; margin-left:auto; }
.ctx-current-dot { width:6px; height:6px; border-radius:50%; background:#5b5f63; flex-shrink:0; }
.ctx-divider { height:1px; background:#f4f5f7; margin:4px 0; }

/* ── Roadmap / Gantt ── */
#roadmap-container { display:flex; flex-direction:column; }
#roadmap-scroll-wrapper { flex:1; overflow:auto; position:relative; }
#roadmap-scroll-wrapper::-webkit-scrollbar { width:8px; height:8px; }
#roadmap-scroll-wrapper::-webkit-scrollbar-track { background:#f4f5f7; }
#roadmap-scroll-wrapper::-webkit-scrollbar-thumb { background:#c5c6bb; border-radius:4px; }
#roadmap-scroll-wrapper::-webkit-scrollbar-thumb:hover { background:#b1b3a9; }
#roadmap-scroll-wrapper::-webkit-scrollbar-corner { background:#f4f5f7; }
.gantt-grid { display:grid; position:relative; }
.gantt-header-corner { position:sticky; top:0; left:0; z-index:20; background:#fbf9f4; border-right:1px solid #c5c6bb; border-bottom:2px solid #b1b3a9; }
.gantt-sprint-header { position:sticky; top:0; z-index:15; background:#fbf9f4; border-right:1px solid #c5c6bb; border-bottom:2px solid #b1b3a9; }
.gantt-sprint-header.current-sprint { background:#efeee6; border-bottom-color:#5b5f63; }
.gantt-row-label { position:sticky; left:0; z-index:10; border-right:1px solid #c5c6bb; border-bottom:1px solid #f0efe7; }
.gantt-cell { position:relative; overflow:visible; border-right:1px solid #f0efe7; border-bottom:1px solid #f0efe7; }
.gantt-cell.current-sprint-col { background:rgba(91,95,99,0.03); }
.gantt-bar { position:absolute; top:50%; transform:translateY(-50%); min-height:20px; max-height:36px; border-radius:4px; font-size:10px; font-weight:600; overflow:hidden; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; padding:4px 6px; line-height:1.35; cursor:grab; transition:filter .1s; z-index:3; }
.gantt-bar:active { cursor:grabbing; }
.gantt-bar:hover { filter:brightness(0.88); }
.gantt-bar--dragging { opacity:0.4; cursor:grabbing !important; }
.gantt-drag-clone { position:fixed; pointer-events:none; z-index:9999; border-radius:4px; font-size:10px; font-weight:600; padding:4px 6px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; opacity:0.85; box-shadow:0 4px 16px rgba(0,0,0,0.25); }
.gantt-bar--initiative { background:rgba(122,88,61,0.82); color:white; }
.gantt-bar--epic { background:rgba(87,99,76,0.82); color:white; }
.gantt-bar--task { background:rgba(91,95,99,0.82); color:white; }
.gantt-bar--unscheduled { background:repeating-linear-gradient(90deg,rgba(177,179,169,0.3) 0px,rgba(177,179,169,0.3) 4px,transparent 4px,transparent 8px); border:1px dashed #b1b3a9; color:#b1b3a9; height:14px; font-size:9px; }
.gantt-dep-svg { position:absolute; top:0; left:0; pointer-events:none; z-index:5; overflow:visible; }
.gantt-dep-handle { position:absolute; top:50%; transform:translate(-50%,-50%); width:12px; height:12px; border-radius:50%; background:white; border:2px solid #5b5f63; cursor:crosshair; z-index:20; opacity:0; transition:opacity .12s,transform .12s; pointer-events:all; }
.gantt-dep-handle:hover { transform:translate(-50%,-50%) scale(1.3); }
.gantt-cell:hover .gantt-dep-handle, .dep-drawing .gantt-dep-handle { opacity:1; }
.gantt-bar--dep-target { outline:2px solid rgba(91,95,99,0.7); outline-offset:2px; filter:brightness(1.08); }
.gantt-bar--dep-invalid { outline:2px solid rgba(159,64,61,0.6); outline-offset:2px; }
.dep-draw-svg { position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:9998; overflow:visible; }
/* Dependency typeahead */
.dep-typeahead-results { position:absolute; z-index:200; background:white; border:1px solid #c5c6bb; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.13); max-height:200px; overflow-y:auto; width:100%; left:0; top:calc(100% + 4px); }
.dep-typeahead-item { padding:7px 10px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.dep-typeahead-item:hover { background:#f0efe7; }

/* ── Field inputs (unstyled base) ── */
.field-label { display:block; font-size:10px; font-weight:700; color:#6b6d63; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.bare-input { background:transparent; border:none; outline:none; width:100%; font-family:'Manrope',sans-serif; }
.bare-input:focus { background:#f5f4ed; border-radius:6px; padding:2px 6px; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">

<!-- ── TOP APP BAR ── -->
<header class="bg-white/80 backdrop-blur-md border-b border-slate-200/60 fixed top-0 z-50 flex justify-between items-center w-full px-6 h-14">
  <div class="flex items-center gap-8">
    <div class="text-lg font-extrabold tracking-tight text-on-background font-headline">Scope Cap</div>
    <nav class="hidden md:flex items-center gap-5">
      <a class="text-primary font-bold border-b-2 border-primary pb-0.5 text-sm" href="#">Projects</a>
      <a class="text-slate-500 hover:text-slate-800 transition-colors text-sm font-medium" href="#">Filters</a>
      <a class="text-slate-500 hover:text-slate-800 transition-colors text-sm font-medium" href="#">Dashboards</a>
    </nav>
  </div>
  <div class="flex items-center gap-2">
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-all active:scale-95">
      <span class="material-symbols-outlined text-xl">notifications</span>
    </button>
    <button class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-all active:scale-95">
      <span class="material-symbols-outlined text-xl">help</span>
    </button>
    <div class="relative ml-1" id="new-wrapper">
      <button id="new-btn" class="bg-primary text-on-primary px-4 py-1.5 rounded-lg font-semibold text-sm hover:bg-primary-dim transition-all active:scale-95 flex items-center gap-1">
        Create
        <span class="material-symbols-outlined text-base">expand_more</span>
      </button>
      <div id="new-dropdown" class="hidden absolute top-[calc(100%+6px)] right-0 bg-white border border-outline-variant/40 rounded-xl shadow-xl z-[300] min-w-[170px] overflow-hidden py-1">
        <div class="dropdown-item flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer text-on-background hover:bg-surface-container-low transition-colors" data-action="new-initiative">
          <span class="w-2.5 h-2.5 rounded-full bg-tertiary-fixed flex-shrink-0"></span> Initiative
        </div>
        <div class="dropdown-item flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer text-on-background hover:bg-surface-container-low transition-colors" data-action="new-epic">
          <span class="w-2.5 h-2.5 rounded-full bg-secondary flex-shrink-0"></span> Epic
        </div>
        <div class="dropdown-item flex items-center gap-3 px-4 py-2.5 text-sm cursor-pointer text-on-background hover:bg-surface-container-low transition-colors" data-action="new-task">
          <span class="w-2.5 h-2.5 rounded-full bg-primary flex-shrink-0"></span> Task
        </div>
      </div>
    </div>
    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-bold text-xs ml-1">SC</div>
  </div>
</header>

<div class="flex mt-14 h-[calc(100vh-3.5rem)] overflow-hidden">

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar" class="bg-surface-container-low border-r border-outline-variant/20 flex flex-col shrink-0 h-[calc(100vh-3.5rem)]">
    <div class="p-3 flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
      <!-- Project chip -->
      <div class="sb-header flex items-center gap-3 px-2 py-3 mb-4">
        <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center text-on-primary font-bold text-xs shrink-0">SCR</div>
        <div class="sb-text flex-1 min-w-0">
          <div class="font-extrabold text-on-background text-sm leading-tight font-headline whitespace-nowrap">Scope Cap</div>
          <div class="text-xs text-slate-500 whitespace-nowrap">Roadmap</div>
        </div>
      </div>
      <!-- Nav -->
      <nav class="flex flex-col gap-0.5">
        <button id="nav-project" onclick="switchView('project')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600">
          <span class="material-symbols-outlined text-xl shrink-0">tune</span>
          <span class="sb-text whitespace-nowrap">Project Details</span>
        </button>
        <button id="nav-team" onclick="switchView('team')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600">
          <span class="material-symbols-outlined text-xl shrink-0">group</span>
          <span class="sb-text whitespace-nowrap">Team</span>
        </button>
        <button id="nav-backlog" onclick="switchView('backlog')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all w-full text-left bg-white text-primary border-l-4 border-primary shadow-sm">
          <span class="material-symbols-outlined text-xl shrink-0">list_alt</span>
          <span class="sb-text whitespace-nowrap">Structure View</span>
        </button>
        <button id="nav-sprints" onclick="switchView('sprints')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600">
          <span class="material-symbols-outlined text-xl shrink-0">sprint</span>
          <span class="sb-text whitespace-nowrap">Sprint View</span>
        </button>
        <button id="nav-roadmap" onclick="switchView('roadmap')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600">
          <span class="material-symbols-outlined text-xl shrink-0">insights</span>
          <span class="sb-text whitespace-nowrap">Roadmap View</span>
        </button>
        <div id="scenario-nav-items" class="flex flex-col gap-0.5 ml-4"></div>
        <button id="nav-summary" onclick="switchView('summary')"
          class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600">
          <span class="material-symbols-outlined text-xl shrink-0">bar_chart</span>
          <span class="sb-text whitespace-nowrap">Summary</span>
        </button>
      </nav>
      <!-- Bottom actions -->
      <div class="mt-auto pt-4 border-t border-outline-variant/20 flex flex-col gap-0.5">
        <button class="sb-bottom-actions flex items-center gap-3 text-primary font-semibold px-3 py-2 hover:bg-white/50 rounded-lg transition-all text-sm w-full">
          <span class="material-symbols-outlined text-xl shrink-0">person_add</span>
          <span class="sb-text whitespace-nowrap">Invite Team</span>
        </button>
        <a class="sb-bottom-actions flex items-center gap-3 text-slate-500 px-3 py-2 hover:bg-white/50 rounded-lg text-sm cursor-pointer">
          <span class="material-symbols-outlined text-xl shrink-0">settings</span>
          <span class="sb-text font-medium whitespace-nowrap">Settings</span>
        </a>
      </div>
    </div>
    <!-- Collapse / expand toggle -->
    <button onclick="toggleSidebar()" title="Toggle sidebar"
      class="flex items-center justify-center w-full py-3 border-t border-outline-variant/20 text-slate-400 hover:text-slate-700 hover:bg-white/50 transition-all shrink-0">
      <span class="material-symbols-outlined text-xl sb-toggle-icon" style="transition:transform .22s ease;">chevron_left</span>
    </button>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <main class="flex-1 overflow-y-auto p-6 min-w-0 min-h-0">
    <!-- Page header -->
    <header id="main-page-header" class="mb-5">
      <nav class="text-xs font-semibold tracking-widest uppercase text-slate-400 mb-1">Projects / Scope Cap Roadmap</nav>
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <h1 id="page-title" class="text-2xl font-extrabold text-on-background tracking-tight font-headline">Structure View</h1>
        <div class="flex items-center gap-2 flex-wrap">
          <!-- Search -->
          <div class="relative">
            <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">search</span>
            <input type="text" id="search-input" placeholder="Search backlog…"
              class="pl-9 pr-3 py-1.5 text-sm border border-outline-variant/50 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary w-52 transition-all">
          </div>
          <!-- Filter pills -->
          <div id="filter-pills" class="flex gap-1">
            <button class="pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-all bg-primary text-on-primary border-primary" data-filter="all">All</button>
            <button class="pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-all bg-white text-slate-600 border-outline-variant/40 hover:bg-surface-container" data-filter="task">Tasks</button>
            <button class="pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-all bg-white text-slate-600 border-outline-variant/40 hover:bg-surface-container" data-filter="epic">Epics</button>
            <button class="pill text-xs font-semibold px-3 py-1.5 rounded-full border transition-all bg-white text-slate-600 border-outline-variant/40 hover:bg-surface-container" data-filter="initiative">Initiatives</button>
          </div>
          <!-- Expand/collapse -->
          <button id="expand-btn"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-outline-variant/40 bg-white text-slate-600 hover:bg-surface-container transition-all">
            Collapse All
          </button>
          <!-- Hide past sprints (sprint view only) -->
          <button id="hide-past-btn" style="display:none;"
            class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-outline-variant/40 bg-white text-slate-600 hover:bg-surface-container transition-all flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">hide_source</span>
            <span id="hide-past-label">Hide Past Sprints</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Backlog card -->
    <div id="backlog-card" class="bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm">
      <div class="flex items-center gap-2 px-4 py-3 border-b border-outline-variant/20 bg-surface-container-low">
        <span class="material-symbols-outlined text-slate-500 text-lg">filter_list</span>
        <span id="backlog-label" class="font-bold text-sm text-on-background">Backlog</span>
        <span id="backlog-count" class="text-[11px] font-bold bg-surface-container text-on-surface-variant px-2 py-0.5 rounded-full ml-1">0 items</span>
      </div>
      <div id="backlog-list"></div>
    </div>

    <!-- Project Details container -->
    <div id="project-container" style="display:none;"></div>

    <!-- Team container -->
    <div id="team-container" style="display:none;"></div>

    <!-- Roadmap container -->
    <div id="roadmap-container" style="display:none;position:relative;flex:1;overflow:hidden;"></div>

    <!-- Summary container -->
    <div id="summary-container" style="display:none;" class="flex flex-col gap-6"></div>
  </main>

  <!-- ── RIGHT DETAIL PANEL ── -->
  <div id="panel" style="position:fixed;top:3.5rem;right:0;width:420px;height:calc(100vh - 3.5rem);transform:translateX(100%);overflow:hidden;border-left:1px solid rgba(177,179,169,0.25);background:white;display:flex;flex-direction:column;z-index:30;box-shadow:-4px 0 24px rgba(0,0,0,0.08);">
    <div id="panel-resize-handle" style="position:absolute;top:0;left:0;width:5px;height:100%;cursor:col-resize;z-index:10;background:transparent;transition:background .15s;" onmouseenter="this.style.background='rgba(91,95,99,0.15)'" onmouseleave="this.style.background='transparent'"></div>
    <div id="panel-scroll" style="width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;"></div>
  </div>
</div>

<!-- ── DELETE MODAL ── -->
<div id="modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(31,33,26,.54);">

let SPRINTS = [];
function computeSprints(){
  const proj=data?data.project:null;
  const startStr=proj?.startDate||'2026-01-01';
  const start=new Date(startStr); start.setHours(0,0,0,0);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmt=d=>`${M[d.getMonth()]} ${d.getDate()}`;
  let count=26;
  if(proj&&!proj.ongoing&&proj.endDate){
    const end=new Date(proj.endDate);
    const diffDays=Math.ceil((end-start)/86400000);
    count=Math.max(1,Math.ceil(diffDays/14));
  }
  SPRINTS=Array.from({length:count},(_,i)=>{
    const s=new Date(start); s.setDate(s.getDate()+i*14);
    const e=new Date(s);     e.setDate(e.getDate()+13);
    return{id:`S${i+1}`,label:`Sprint ${i+1}`,start:new Date(s),end:new Date(e),dates:`${fmt(s)} – ${fmt(e)}`};
  });
}
function currentSprintId(){
  const now=new Date(); const sp=SPRINTS.find(s=>now>=s.start&&now<=s.end); return sp?sp.id:null;
}

const STORAGE_KEY = 'scopeCapData_v3';
let data = null;
const appState = {
  view: 'backlog',
  collapsed: {},
  allCollapsed: false,
  filters: { search:'', type:'all' },
  panel: { open:false, type:null, id:null },

  ganttLabelW: 260,
  roadmapLocked: false,
  scenarioId: null,
  hidePastSprints: false,

  compareBase: null,
  compareTarget: null,
  summaryBase: 'main',
  summaryTarget: null,
};

// ================================================================
function loadData(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ data=JSON.parse(raw); if(!data.comments) data.comments={}; if(!data.dependencies) data.dependencies=[]; if(!data.team) data.team=[]; if(!data.counters.member) data.counters.member=0; if(!data.scenarios) data.scenarios=[]; if(!data.counters.scenario) data.counters.scenario=0; data.tasks.forEach(t=>{if(t.sprintId===undefined)t.sprintId=null;}); data.team.forEach(m=>{if(m.discipline===undefined)m.discipline=null;}); data.scenarios.forEach(s=>{if(!s.tasks) s.tasks=[];});
      // Migrate: normalise all members to standard hours/days and add any new members
      data.team.forEach(m=>{ m.hoursPerSprint=54; m.statHolidays=20; m.ptoDays=10; m.sickDays=10; });
      const existingNames=new Set(data.team.map(m=>m.name));
      [{name:'Lisa Park',discipline:'Code'},{name:'Kevin Zhao',discipline:'Code'},{name:'Priya Singh',discipline:'UI'},{name:'Ravi Nair',discipline:'Code'},{name:'Jordan Lee',discipline:'UX'},{name:'Sam Okafor',discipline:'VFX'},{name:'Casey Morgan',discipline:'VO'},{name:'Riley Walsh',discipline:'UI'}].forEach(m=>{if(!existingNames.has(m.name)){data.counters.member=(data.counters.member||0)+1;data.team.push({id:`TM-${data.counters.member}`,hoursPerSprint:54,statHolidays:20,ptoDays:10,sickDays:10,...m});}});
      // Migrate: project settings
      if(!data.project) data.project={startDate:'2026-01-01',endDate:null,ongoing:true,milestones:[{id:'MS-1',name:'Project Kick-off',date:null,order:0,fixed:true},{id:'MS-2',name:'Pre-Production',date:null,order:1,fixed:true},{id:'MS-3',name:'Production',date:null,order:2,fixed:true},{id:'MS-4',name:'Alpha',date:null,order:3,fixed:true},{id:'MS-5',name:'Beta',date:null,order:4,fixed:true},{id:'MS-6',name:'Final',date:null,order:5,fixed:true}],bufferPercent:0};
      if(!data.counters.milestone) data.counters.milestone=6;
      if(!data.summaryNotes) data.summaryNotes={};
      saveData();
    }
    else { data=getSampleData(); saveData(); }
  } catch(e){ data=getSampleData(); }
  computeSprints();
  refreshAssigneesList();
}
function refreshAssigneesList(){
  const dl=document.getElementById('assignees-list');
  if(!dl)return;
  dl.innerHTML=data.team.map(m=>m.name?`<option value="${esc(m.name)}">`:'' ).join('')+'<option value="Unassigned">';
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); }catch(e){} }

// ================================================================
// DATA HELPERS
// ================================================================
function getCollection(type){ return type==='initiative'?data.initiatives:type==='epic'?data.epics:type==='task'?data.tasks:data.team; }
function getItem(type,id){
  const item=getCollection(type).find(i=>i.id===id);
  if(item) return item;
  if(type==='task'&&appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    return (scn?.tasks||[]).find(t=>t.id===id)||null;
  }
  return null;
}
function nextId(type){ data.counters[type]++; return `${{initiative:'INI',epic:'EP',task:'TASK',member:'TM'}[type]}-${data.counters[type]}`; }
function createItem(type,fields){ const coll=getCollection(type); const maxOrder=coll.length?Math.max(...coll.map(i=>i.order))+1:0; const item={id:nextId(type),order:maxOrder,...fields}; coll.push(item); saveData(); return item; }
function updateItem(type,id,updates){
  const coll=getCollection(type);
  const idx=coll.findIndex(i=>i.id===id);
  if(idx>=0){Object.assign(coll[idx],updates);saveData();return;}
  if(type==='task'&&appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    if(scn){const si=(scn.tasks||[]).findIndex(t=>t.id===id);if(si>=0){Object.assign(scn.tasks[si],updates);saveData();}}
  }
}
function removeItem(type,id){
  const key={initiative:'initiatives',epic:'epics',task:'tasks',member:'team'}[type];
  const prev=data[key].length;
  data[key]=data[key].filter(i=>i.id!==id);
  if(data[key].length===prev&&type==='task'&&appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    if(scn) scn.tasks=(scn.tasks||[]).filter(t=>t.id!==id);
  }
  if(type==='epic'){
    data.tasks.forEach(t=>{if(t.epicId===id) t.epicId=null;});
    if(appState.scenarioId){
      const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
      (scn?.tasks||[]).forEach(t=>{if(t.epicId===id) t.epicId=null;});
    }
  }
  if(type==='initiative') data.epics.forEach(e=>{if(e.initiativeId===id) e.initiativeId=null;});
  data.dependencies=data.dependencies.filter(d=>d.fromId!==id&&d.toId!==id);
  if(appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    if(scn) scn.dependencies=(scn.dependencies||[]).filter(d=>d.fromId!==id&&d.toId!==id);
  }
  saveData();
}
function addDependency(fromId,toId){
  if(fromId===toId)return;
  const deps=getActiveDeps();
  if(deps.some(d=>d.fromId===fromId&&d.toId===toId))return;
  deps.push({id:`dep-${Date.now()}`,fromId,toId});
  saveData();
}
function removeDependency(depId){
  if(appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    if(scn){scn.dependencies=scn.dependencies.filter(d=>d.id!==depId);saveData();}
  } else {
    data.dependencies=data.dependencies.filter(d=>d.id!==depId);
    saveData();
  }
}
function getDepsForItem(itemId){
  const deps=getActiveDeps();
  return{dependsOn:deps.filter(d=>d.fromId===itemId),blocks:deps.filter(d=>d.toId===itemId)};
}
function getActiveSprintId(task){
  if(!appState.scenarioId)return task.sprintId;
  const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
  return scn?(scn.sprintOverrides[task.id]??task.sprintId):task.sprintId;
}
function getActiveDeps(){
  if(!appState.scenarioId)return data.dependencies;
  const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
  return scn?scn.dependencies:data.dependencies;
}
function getScenarioTasks(scn){
  return [...data.tasks,...(scn?.tasks||[])];
}
function createScenario(name){
  data.counters.scenario++;
  const id=`SCN-${data.counters.scenario}`;
  const sprintOverrides={};
  data.tasks.forEach(t=>{sprintOverrides[t.id]=t.sprintId;});
  const dependencies=JSON.parse(JSON.stringify(data.dependencies));
  data.scenarios.push({id,name,createdAt:Date.now(),sprintOverrides,dependencies,tasks:[]});
  saveData();
  return id;
}
function deleteScenario(id){
  data.scenarios=data.scenarios.filter(s=>s.id!==id);
  saveData();
  if(appState.scenarioId===id){
    appState.scenarioId=null;
    renderRoadmap();
  }
  renderScenarioNavItems();
}
function commitScenario(id){
  const scn=data.scenarios.find(s=>s.id===id); if(!scn) return;
  Object.entries(scn.sprintOverrides).forEach(([taskId,spId])=>{
    const t=data.tasks.find(x=>x.id===taskId); if(t) t.sprintId=spId;
  });
  (scn.tasks||[]).forEach(t=>{ if(!data.tasks.find(x=>x.id===t.id)) data.tasks.push(t); });
  data.dependencies=scn.dependencies;
  data.scenarios=data.scenarios.filter(s=>s.id!==id);
  appState.scenarioId=null;
  saveData(); renderScenarioNavItems(); renderRoadmap();
}

function resolveItemAnyType(id){
  const t=data.tasks.find(i=>i.id===id); if(t)return{item:t,type:'task'};
  if(appState.scenarioId){
    const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
    const st=(scn?.tasks||[]).find(i=>i.id===id); if(st)return{item:st,type:'task'};
  }
  const e=data.epics.find(i=>i.id===id); if(e)return{item:e,type:'epic'};
  const n=data.initiatives.find(i=>i.id===id); if(n)return{item:n,type:'initiative'};
  return null;
}
function memberAvailableHours(m){
  return Math.max(0,(SPRINTS.length*(m.hoursPerSprint||0))-((+(m.statHolidays||0)+ +(m.ptoDays||0)+ +(m.sickDays||0))*6));
}
function getTeamDisciplines(){
  const seen=new Set();
  data.team.forEach(m=>{ if(m.discipline) seen.add(m.discipline); });
  return [...seen].sort();
}
function getDisciplineCapacityPerSprint(discipline){
  const raw=data.team.filter(m=>m.discipline===discipline).reduce((sum,m)=>sum+memberAvailableHours(m)/SPRINTS.length,0);
  const buf=data.project?.bufferPercent||0;
  return raw*(1-buf/100);
}
function getSprintDisciplineUsed(sprintId,discipline){
  const sprintIdx=SPRINTS.findIndex(s=>s.id===sprintId);
  if(sprintIdx<0)return 0;
  let total=0;
  const activeTasks=appState.scenarioId?getScenarioTasks(data.scenarios.find(s=>s.id===appState.scenarioId)):data.tasks;
  activeTasks.forEach(t=>{
    if(t.discipline!==discipline)return;
    const sid=appState.scenarioId?getActiveSprintId(t):t.sprintId;
    if(sid===sprintId){total+=+(t.estimate||0);}
  });
  return total;
}

    const track=document.createElement('div');

    const fill=document.createElement('div');
    fill.style.cssText=`height:100%;width:${Math.round(pct*100)}%;border-radius:6px;background:${over?'#9f403d':'#5b5f63'};`;

  tip.style.left=left+'px';
  tip.style.top=(rect.bottom+6)+'px';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function matchSearch(item){ const q=appState.filters.search.trim().toLowerCase(); return !q||(item.summary||'').toLowerCase().includes(q); }
function shouldShowTask(t){ const tf=appState.filters.type; if(tf==='initiative'||tf==='epic') return false; return matchSearch(t); }
function shouldShowEpic(e){ const tf=appState.filters.type; if(tf==='initiative') return false; if(matchSearch(e)&&tf!=='task') return true; if(tf==='task'||tf==='all') return data.tasks.filter(t=>t.epicId===e.id).some(shouldShowTask); return false; }
function shouldShowInitiative(i){ const tf=appState.filters.type; if(tf==='task') return data.epics.filter(e=>e.initiativeId===i.id).some(e=>data.tasks.filter(t=>t.epicId===e.id).some(shouldShowTask)); if(tf==='epic') return data.epics.filter(e=>e.initiativeId===i.id).some(e=>matchSearch(e)); if(matchSearch(i)&&tf!=='task') return true; return data.epics.filter(e=>e.initiativeId===i.id).some(shouldShowEpic); }

const PRI = {
  Critical:{ dot:'bg-error', text:'text-error', badge:'bg-error/10 text-error border-error/20' },
  High:    { dot:'bg-tertiary-fixed', text:'text-tertiary', badge:'bg-tertiary-container/40 text-tertiary border-tertiary/20' },
  Medium:  { dot:'bg-secondary-fixed', text:'text-secondary', badge:'bg-secondary-container/40 text-secondary border-secondary/20' },
  Low:     { dot:'bg-surface-container-highest', text:'text-on-surface-variant', badge:'bg-surface-container-highest text-on-surface-variant border-outline-variant/30' },
};
function priClasses(p){ return (PRI[p]||PRI.Low).badge; }
function initials(name){ if(!name||name==='Unassigned')return'?'; return name.split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase(); }
const AVC=['#5b5f63','#57634c','#7a583d','#36B37E','#00B8D9','#FF5630','#4C6EF5','#20C997'];
function avatarBg(name){ if(!name||name==='Unassigned')return'#c5c6bb'; let h=0; for(const c of name)h=(h*31+c.charCodeAt(0))%AVC.length; return AVC[h]; }
function avatarColor(name){ return(!name||name==='Unassigned')?'#5e6058':'white'; }
function fmtDate(iso){ const d=new Date(iso); const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }

// ================================================================
function renderBacklog(){
  if(appState.view==='sprints'){renderSprintView();return;}
  if(appState.view==='roadmap'){renderRoadmap();return;}
  if(appState.view==='team'){renderTeamView();return;}
  const list=document.getElementById('backlog-list');
  list.innerHTML='';
  let count=0;
  const sorted=arr=>[...arr].sort((a,b)=>a.order-b.order);

  for(const ini of sorted(data.initiatives)){
    if(!shouldShowInitiative(ini))continue;
    count++;list.appendChild(buildRow(ini,'initiative',0));
    if(appState.collapsed[ini.id])continue;
    for(const epic of sorted(data.epics.filter(e=>e.initiativeId===ini.id))){
      if(!shouldShowEpic(epic))continue;
      count++;list.appendChild(buildRow(epic,'epic',1));
      if(appState.collapsed[epic.id])continue;
      for(const task of sorted(data.tasks.filter(t=>t.epicId===epic.id))){
        if(!shouldShowTask(task))continue;
        count++;list.appendChild(buildRow(task,'task',2));
      }
    }
  }
  const orphanEpics=sorted(data.epics.filter(e=>!e.initiativeId||!data.initiatives.find(i=>i.id===e.initiativeId))).filter(shouldShowEpic);
  if(orphanEpics.length){
    list.appendChild(makeSep('Epics without Initiative'));
    for(const epic of orphanEpics){count++;list.appendChild(buildRow(epic,'epic',0));if(!appState.collapsed[epic.id])for(const task of sorted(data.tasks.filter(t=>t.epicId===epic.id))){if(!shouldShowTask(task))continue;count++;list.appendChild(buildRow(task,'task',1));}}
  }
  const orphanTasks=sorted(data.tasks.filter(t=>!t.epicId||!data.epics.find(e=>e.id===t.epicId))).filter(shouldShowTask);
  if(orphanTasks.length){list.appendChild(makeSep('Tasks without Epic'));for(const task of orphanTasks){count++;list.appendChild(buildRow(task,'task',0));}}
  if(!list.children.length) list.appendChild(makeEmpty());

  // Add "Create issue" row
  const addRow=document.createElement('div');
  addRow.className='flex items-center gap-2 px-4 py-3 text-slate-400 hover:text-primary transition-colors cursor-pointer bg-surface-container-lowest/80 border-t border-surface-container-low';
  addRow.innerHTML='<span class="material-symbols-outlined text-lg">add</span><span class="text-sm font-medium">Create issue</span>';
  addRow.addEventListener('click',()=>onNewItem('task'));
  list.appendChild(addRow);

  document.getElementById('backlog-count').textContent=`${count} issue${count!==1?'s':''}`;
  document.getElementById('backlog-label').textContent='Structure View';
}

        zone.addEventListener('dragover',e=>{if(!dragState||dragState.type!=='task')return;e.preventDefault();zone.classList.add('drag-active');});
        zone.addEventListener('dragleave',()=>zone.classList.remove('drag-active'));
        zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-active');if(!dragState||dragState.type!=='task')return;updateItem('task',dragState.id,{sprintId:sprintId==='__backlog'?null:sprintId});dragState=null;renderSprintView();});
        card.appendChild(zone);
      } else {
        for(const task of tasks){
          taskCount++;
          const taskRow=buildRow(task,'task',0);
          // Slightly different bg inside cards
          taskRow.classList.remove('bg-surface-container-lowest');
          taskRow.classList.add('bg-white');
          card.appendChild(taskRow);
        }
      }
    }
    return card;
  };

  // Unscheduled bucket
  const unsched=sorted(data.tasks.filter(t=>!t.sprintId)).filter(taskMatches);
  list.appendChild(renderCard('__backlog','Unscheduled','Not yet assigned to a sprint',false,false,unsched));

  // Sprint cards
  for(const sprint of SPRINTS){
    const sprintTasks=sorted(data.tasks.filter(t=>t.sprintId===sprint.id)).filter(taskMatches);
    const isCurrent=sprint.id===curId;
    const isPast=sprint.end<new Date()&&!isCurrent;
    if(isPast&&appState.hidePastSprints) continue;
    list.appendChild(renderCard(sprint.id,sprint.label,sprint.dates,isCurrent,isPast,sprintTasks));
  }

  document.getElementById('backlog-count').textContent=`${taskCount} task${taskCount!==1?'s':''}`;
  document.getElementById('backlog-label').textContent='Sprint View';
  const lbl=document.getElementById('hide-past-label');
  if(lbl) lbl.textContent=appState.hidePastSprints?'Show Past Sprints':'Hide Past Sprints';
}

        <span class="material-symbols-outlined" style="font-size:14px;">close</span></button>`:''}

  };

  section.innerHTML=`
    <label class="field-label mb-2 block">Dependencies</label>
    <div class="mb-3">
      <p style="font-size:10px;font-weight:700;color:#9e9f95;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Depends On</p>
      <div id="deps-depends-on">${dependsOn.length?dependsOn.map(d=>depRow(d,true)).join(''):'<p style="font-size:11px;color:#9e9f95;font-style:italic;">None</p>'}</div>
    </div>
    <div class="mb-3">
      <p style="font-size:10px;font-weight:700;color:#9e9f95;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Blocks</p>
      <div>${blocks.length?blocks.map(d=>depRow(d,false)).join(''):'<p style="font-size:11px;color:#9e9f95;font-style:italic;">None</p>'}</div>
    </div>
    <div style="position:relative;">
      <p style="font-size:10px;font-weight:700;color:#9e9f95;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Add Dependency</p>
      <input type="text" id="dep-search-input" placeholder="Search items…" autocomplete="off"
        style="width:100%;font-size:12px;background:#f5f4ed;border:1px solid #c5c6bb;border-radius:8px;padding:6px 10px;outline:none;box-sizing:border-box;"
        onfocus="this.style.borderColor='#5b5f63'" onblur="this.style.borderColor='#c5c6bb'">
      <div id="dep-typeahead-results" class="dep-typeahead-results hidden"></div>
    </div>`;

  // Hover effect for remove buttons
  section.querySelectorAll('.dep-remove-btn').forEach(btn=>{
    btn.closest('[data-dep-id]').addEventListener('mouseenter',()=>btn.style.opacity='1');
    btn.closest('[data-dep-id]').addEventListener('mouseleave',()=>btn.style.opacity='0');
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      removeDependency(btn.dataset.depId);
      renderPanelDependencies(type,id);
      if(appState.view==='roadmap')renderRoadmap();
    });
  });

  // Navigate on dep link click
  section.querySelectorAll('.dep-link').forEach(link=>{
    link.addEventListener('click',()=>openPanel(link.dataset.type,link.dataset.id));
  });

  initDepTypeahead(id,type);
}

function initDepTypeahead(currentId,currentType){
  const input=document.getElementById('dep-search-input');
  const results=document.getElementById('dep-typeahead-results');
  if(!input||!results)return;
  const{dependsOn}=getDepsForItem(currentId);
  const linked=new Set(dependsOn.map(d=>d.toId));
  const tc={initiative:'#7a583d',epic:'#57634c',task:'#5b5f63'};
  const ti={initiative:'bolt',epic:'view_quilt',task:'check_box_outline_blank'};

  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase();
    results.innerHTML='';
    if(!q){results.classList.add('hidden');return;}
    const depActiveTasks=appState.scenarioId?getScenarioTasks(data.scenarios.find(s=>s.id===appState.scenarioId)):data.tasks;
    const all=[
      ...data.initiatives.map(i=>({item:i,type:'initiative'})),
      ...data.epics.map(e=>({item:e,type:'epic'})),
      ...depActiveTasks.map(t=>({item:t,type:'task'})),
    ].filter(({item})=>item.id!==currentId&&!linked.has(item.id)&&`${item.id} ${item.summary}`.toLowerCase().includes(q)).slice(0,10);

    if(!all.length){
      results.innerHTML='<div class="dep-typeahead-item" style="color:#9e9f95;">No matches found</div>';
    } else {
      all.forEach(({item,type:t})=>{
        const el=document.createElement('div');
        el.className='dep-typeahead-item';
        el.innerHTML=`<span class="material-symbols-outlined" style="font-size:14px;color:${tc[t]};">${ti[t]}</span>`+
          `<span style="font-size:10px;font-family:monospace;color:#9e9f95;flex-shrink:0;">${esc(item.id)}</span>`+
          `<span style="font-size:12px;color:#31332c;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${esc(item.summary)}</span>`;
        el.addEventListener('mousedown',e=>{
          e.preventDefault();
          addDependency(currentId,item.id);
          linked.add(item.id);
          input.value='';
          results.classList.add('hidden');
          renderPanelDependencies(currentType,currentId);
          if(appState.view==='roadmap')renderRoadmap();
        });
        results.appendChild(el);
      });
    }
    results.classList.remove('hidden');
  });

  input.addEventListener('blur',()=>setTimeout(()=>results.classList.add('hidden'),150));
  input.addEventListener('keydown',e=>{if(e.key==='Escape'){results.classList.add('hidden');input.value='';}});
}

// ================================================================
// PANEL RESIZE
// ================================================================
(function(){
  let resizing = false;
  const MIN_W = 280, MAX_W = 860;
  const handle = document.getElementById('panel-resize-handle');
  const panel  = document.getElementById('panel');

  handle.addEventListener('mousedown', e => {
    resizing = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    const w = Math.min(MAX_W, Math.max(MIN_W, window.innerWidth - e.clientX));
    panel.style.width = w + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

        <label class="field-label">Description</label>

      <section class="grid grid-cols-2 gap-y-5 gap-x-4">

    });
    bind('pf-epicId','epicId',v=>v||null);
  }
  if(type==='epic') bind('pf-initiativeId','initiativeId',v=>v||null);

  renderPanelDependencies(type,id);

    saveData(); renderPanel(); renderBacklog();
  });
}

          value="${+(m.statHolidays||0)}" data-id="${esc(m.id)}" data-field="statHolidays">
      </div>
      <div>
        <label class="field-label">PTO Days</label>
        <input type="number" min="0" max="365" class="tm-field w-full text-sm bg-slate-50 border border-outline-variant/30 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary"
          value="${+(m.ptoDays||0)}" data-id="${esc(m.id)}" data-field="ptoDays">

      <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">

  card.querySelectorAll('.tm-field').forEach(input=>{
    const field=input.dataset.field;
    const recalc=()=>{
      // read all current values from the card's inputs
      const vals={};
      card.querySelectorAll('.tm-field').forEach(el=>{ vals[el.dataset.field]=+(el.value||0); });
      const updated={...m,...vals};
      const newAvail=memberAvailableHours(updated);
      const newGross=SPRINTS.length*(updated.hoursPerSprint||0);
      const newDays=(updated.statHolidays||0)+(updated.ptoDays||0)+(updated.sickDays||0);

    };
    input.addEventListener('input',recalc);
    input.addEventListener('blur',()=>{
      const val=+(input.value||0);
      updateItem('member',m.id,{[field]:val});
      Object.assign(m,{[field]:val}); // keep local ref in sync
    });
  });

  // ── Discipline ──
  card.querySelector('.tm-discipline').addEventListener('change',function(){
    const val=this.value||null;
    updateItem('member',m.id,{discipline:val});
    Object.assign(m,{discipline:val});
  });

  // ── Delete ──
  card.querySelector('.tm-delete').addEventListener('click',()=>showDeleteModal('member',m.id));

  return card;
}

function getItemSprintRange(id,type){
  const si=sid=>SPRINTS.findIndex(s=>s.id===sid);
  if(type==='task'){
    const t=getItem('task',id); if(!t)return null;
    const spId=getActiveSprintId(t); if(!spId)return null;
    const idx=si(spId); if(idx<0)return null;
    return{startIndex:idx,endIndex:idx};
  }
  if(type==='epic'){
    const activeTasks=appState.scenarioId?getScenarioTasks(data.scenarios.find(s=>s.id===appState.scenarioId)):data.tasks;
    const kids=activeTasks.filter(t=>t.epicId===id);
    if(!kids.length)return null;
    const idxs=kids.map(t=>si(getActiveSprintId(t))).filter(i=>i>=0);
    if(!idxs.length)return null;
    return{startIndex:Math.min(...idxs),endIndex:Math.max(...idxs)};
  }
  if(type==='initiative'){
    const epics=data.epics.filter(e=>e.initiativeId===id);
    const all=[];
    for(const e of epics){const r=getItemSprintRange(e.id,'epic');if(r){all.push(r.startIndex,r.endIndex);}}
    if(!all.length)return null;
    return{startIndex:Math.min(...all),endIndex:Math.max(...all)};
  }
  return null;
}

function getItemSprintRangeForScenario(id,type,scenarioId){
  const si=sid=>SPRINTS.findIndex(s=>s.id===sid);
  const getSpId=task=>{
    if(!scenarioId)return task.sprintId;
    const scn=data.scenarios.find(s=>s.id===scenarioId);
    return scn?(scn.sprintOverrides[task.id]??task.sprintId):task.sprintId;
  };
  if(type==='task'){
    const t=getItem('task',id);if(!t)return null;
    const spId=getSpId(t);if(!spId)return null;
    const idx=si(spId);if(idx<0)return null;
    return{startIndex:idx,endIndex:idx};
  }
  if(type==='epic'){
    const kids=data.tasks.filter(t=>t.epicId===id);
    if(!kids.length)return null;
    const idxs=kids.map(t=>si(getSpId(t))).filter(i=>i>=0);
    if(!idxs.length)return null;
    return{startIndex:Math.min(...idxs),endIndex:Math.max(...idxs)};
  }
  if(type==='initiative'){
    const epics=data.epics.filter(e=>e.initiativeId===id);
    const all=[];
    for(const e of epics){const r=getItemSprintRangeForScenario(e.id,'epic',scenarioId);if(r){all.push(r.startIndex,r.endIndex);}}
    if(!all.length)return null;
    return{startIndex:Math.min(...all),endIndex:Math.max(...all)};
  }
  return null;
}

// ── Gantt drag-and-drop state ──
let ganttDrag=null;

// ── Dependency draw state ──
let depDraw=null;
let ganttBarRegistry=[];  // [{id, type, el}] — populated each renderRoadmap
let selectedDepId=null;   // currently selected dependency arrow

function startDepDraw(fromId, handleEl, side='right'){
  const hr=handleEl.getBoundingClientRect();
  const ax=hr.left+hr.width/2, ay=hr.top+hr.height/2;

  // Use setAttribute for SVG className — svg.className is an SVGAnimatedString, not a string
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','dep-draw-svg');
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<marker id="dep-draw-arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#5b5f63"/></marker>`;
  svg.appendChild(defs);
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('fill','none');
  path.setAttribute('stroke','#5b5f63');
  path.setAttribute('stroke-width','2');
  path.setAttribute('stroke-dasharray','6 3');
  path.setAttribute('marker-end','url(#dep-draw-arrow)');
  // Draw initial zero-length path so it's visible immediately
  path.setAttribute('d',`M${ax},${ay} L${ax},${ay}`);
  svg.appendChild(path);
  document.body.appendChild(svg);

  // Prevent text selection from interfering with mousemove
  document.body.style.userSelect='none';

  const wrapper=document.getElementById('roadmap-scroll-wrapper');
  if(wrapper) wrapper.classList.add('dep-drawing');

  let hoveredId=null, hoveredEl=null;

  function onMove(mv){
    const tx=mv.clientX, ty=mv.clientY;
    const cx=Math.max(40,Math.abs(tx-ax)*0.45);
    path.setAttribute('d',`M${ax},${ay} C${ax+cx},${ay} ${tx-cx},${ty} ${tx},${ty}`);

    let found=null;
    for(const entry of ganttBarRegistry){
      if(entry.id===fromId) continue;
      const r=entry.el.getBoundingClientRect();
      const pad=8;
      if(tx>=r.left-pad&&tx<=r.right+pad&&ty>=r.top&&ty<=r.bottom){ found=entry; break; }
    }

    if(hoveredEl&&(!found||hoveredEl!==found.el)){
      hoveredEl.classList.remove('gantt-bar--dep-target','gantt-bar--dep-invalid');
    }
    if(found){
      // Check both directions for duplicates
      const dupe=getActiveDeps().some(d=>(d.fromId===found.id&&d.toId===fromId)||(d.fromId===fromId&&d.toId===found.id));
      found.el.classList.add(dupe?'gantt-bar--dep-invalid':'gantt-bar--dep-target');
      hoveredId=found.id; hoveredEl=found.el;
    } else {
      hoveredId=null; hoveredEl=null;
    }
  }

  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.body.style.userSelect='';
    svg.remove();
    if(wrapper) wrapper.classList.remove('dep-drawing');
    if(hoveredEl) hoveredEl.classList.remove('gantt-bar--dep-target','gantt-bar--dep-invalid');
    depDraw=null;
    // Right handle: fromId is predecessor → hoveredId depends on fromId
    //   addDependency(dependent=hoveredId, predecessor=fromId)
    // Left handle:  fromId is dependent → fromId depends on hoveredId
    //   addDependency(dependent=fromId, predecessor=hoveredId)
    if(hoveredId && !getActiveDeps().some(d=>(d.fromId===hoveredId&&d.toId===fromId)||(d.fromId===fromId&&d.toId===hoveredId))){
      if(side==='left') addDependency(fromId, hoveredId);
      else addDependency(hoveredId, fromId);
      renderRoadmap();
    }
  }

  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
  depDraw={fromId,side};
}

function applySprintDelta(itemId, type, delta){
  const scn=appState.scenarioId?data.scenarios.find(s=>s.id===appState.scenarioId):null;
  const activeTasks=scn?getScenarioTasks(scn):data.tasks;
  const writeTask=(taskId)=>{
    // Check if it's a scenario-private task (only in scn.tasks)
    const isScnPrivate=scn&&!(data.tasks.find(x=>x.id===taskId));
    const t=isScnPrivate?(scn.tasks||[]).find(x=>x.id===taskId):data.tasks.find(x=>x.id===taskId);
    if(!t)return;
    const curSpId=getActiveSprintId(t);
    if(!curSpId)return;
    const idx=SPRINTS.findIndex(s=>s.id===curSpId);
    const newIdx=Math.max(0,Math.min(SPRINTS.length-1,idx+delta));
    if(isScnPrivate){t.sprintId=SPRINTS[newIdx].id;saveData();}
    else if(scn){scn.sprintOverrides[taskId]=SPRINTS[newIdx].id;saveData();}
    else{updateItem('task',taskId,{sprintId:SPRINTS[newIdx].id});}
  };
  if(type==='task'){
    writeTask(itemId);
  } else if(type==='epic'){
    activeTasks.filter(t=>t.epicId===itemId).forEach(t=>writeTask(t.id));
  } else if(type==='initiative'){
    const epicIds=data.epics.filter(e=>e.initiativeId===itemId).map(e=>e.id);
    activeTasks.filter(t=>epicIds.includes(t.epicId)).forEach(t=>writeTask(t.id));
  }
}

function startGanttDrag(e, bar, item, type, range, SPRINT_W, LABEL_W, ROW_H, rowIdx){
  if(e.button!==0)return;
  e.preventDefault();
  e.stopPropagation();

  const barRect=bar.getBoundingClientRect();
  // Clone
  const clone=document.createElement('div');
  clone.className='gantt-drag-clone gantt-bar--'+type;
  clone.textContent=item.summary;
  const cloneW=barRect.width;
  clone.style.cssText=`width:${cloneW}px;top:${barRect.top}px;left:${barRect.left}px;min-height:${barRect.height}px;`;
  document.body.appendChild(clone);

  bar.classList.add('gantt-bar--dragging');

  const startX=e.clientX;
  const startSprintIdx=range.startIndex;
  let lastDelta=0;

  // Find the roadmap scroll wrapper to compute offset
  const wrapper=document.getElementById('roadmap-scroll-wrapper');

  function onMove(mv){
    const dx=mv.clientX-startX;
    const rawDelta=Math.round(dx/SPRINT_W);
    lastDelta=rawDelta;
    const newStartIdx=Math.max(0,Math.min(SPRINTS.length-1,startSprintIdx+rawDelta));
    const snapLeft=barRect.left+(newStartIdx-startSprintIdx)*SPRINT_W;
    clone.style.left=snapLeft+'px';
    clone.style.top=barRect.top+'px';
  }

  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    clone.remove();
    bar.classList.remove('gantt-bar--dragging');
    if(lastDelta!==0){
      applySprintDelta(item.id,type,lastDelta);
      renderRoadmap();
    }
  }

  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

      const badge=document.createElement('span');
      badge.style.cssText='font-size:11px;font-weight:600;color:#7b7d73;display:flex;align-items:center;gap:4px;flex:1;';
      badge.innerHTML=`<span class="material-symbols-outlined" style="font-size:13px;">info</span>Roadmap is locked – drag, drop and dependency editing are disabled`;
      toolbar.appendChild(badge);
    }
    const addScnBtn=document.createElement('button');
    addScnBtn.innerHTML=`<span class="material-symbols-outlined" style="font-size:16px;">fork_right</span><span style="font-size:12px;font-weight:600;">Add Scenario</span>`;
    addScnBtn.style.cssText='display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:8px;border:1px solid #c5c6bb;background:white;color:#5e6058;cursor:pointer;font-family:inherit;transition:all .15s;';
    addScnBtn.addEventListener('click',()=>{
      const name=window.prompt('Scenario name:','New Scenario');
      if(!name||!name.trim())return;
      const id=createScenario(name.trim());
      renderScenarioNavItems();
      switchView('scenario',id);
    });
    const cmpBtn=document.createElement('button');
    cmpBtn.innerHTML=`<span class="material-symbols-outlined" style="font-size:16px;">compare_arrows</span><span style="font-size:12px;font-weight:600;">Compare Scenarios</span>`;
    cmpBtn.style.cssText='display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:8px;border:1px solid #c5c6bb;background:white;color:#5e6058;cursor:pointer;font-family:inherit;transition:all .15s;';
    cmpBtn.addEventListener('click',openCompareModal);
    toolbar.appendChild(addScnBtn);
    toolbar.appendChild(cmpBtn);
    toolbar.appendChild(lockBtn);
  }
  container.appendChild(toolbar);

  const LABEL_W=appState.ganttLabelW, SPRINT_W=100, ROW_H=52;
  const curSpId=currentSprintId();
  const sorted=arr=>[...arr].sort((a,b)=>a.order-b.order);

  // Build ordered rows
  const activeTasks=appState.scenarioId?getScenarioTasks(data.scenarios.find(s=>s.id===appState.scenarioId)):data.tasks;
  const rows=[];
  for(const ini of sorted(data.initiatives)){
    rows.push({item:ini,type:'initiative',indent:0});
    for(const epic of sorted(data.epics.filter(e=>e.initiativeId===ini.id))){
      rows.push({item:epic,type:'epic',indent:1});
      for(const task of sorted(activeTasks.filter(t=>t.epicId===epic.id))){
        rows.push({item:task,type:'task',indent:2});
      }
    }
  }
  const linkedEpicIds=new Set(data.epics.filter(e=>e.initiativeId&&data.initiatives.find(i=>i.id===e.initiativeId)).map(e=>e.id));
  for(const epic of sorted(data.epics.filter(e=>!linkedEpicIds.has(e.id)))){
    rows.push({item:epic,type:'epic',indent:0});
    for(const task of sorted(activeTasks.filter(t=>t.epicId===epic.id))){
      rows.push({item:task,type:'task',indent:1});
    }
  }
  const linkedTaskIds=new Set(activeTasks.filter(t=>t.epicId&&data.epics.find(e=>e.id===t.epicId)).map(t=>t.id));
  for(const task of sorted(activeTasks.filter(t=>!linkedTaskIds.has(t.id)))){
    rows.push({item:task,type:'task',indent:0});
  }
  const rowIndexMap={};
  rows.forEach((r,i)=>{ rowIndexMap[r.item.id]=i; });

  // Violation: dependent item scheduled at or before its predecessor ends
  const violatedIds=new Set();
  const violatedDepIds=new Set();
  if(!appState.compareMode){
    for(const dep of getActiveDeps()){
      const bRes=resolveItemAnyType(dep.toId);
      const dRes=resolveItemAnyType(dep.fromId);
      if(!bRes||!dRes) continue;
      const bRange=getItemSprintRange(dep.toId,bRes.type);
      const dRange=getItemSprintRange(dep.fromId,dRes.type);
      if(!bRange||!dRange) continue;
      if(bRange.startIndex<=dRange.endIndex){violatedIds.add(dep.toId);violatedDepIds.add(dep.id);}
    }
  }

  const totalW=LABEL_W+SPRINTS.length*SPRINT_W;
  const totalH=ROW_H+rows.length*ROW_H;

  const wrapper=document.createElement('div');
  wrapper.id='roadmap-scroll-wrapper';

  const grid=document.createElement('div');
  grid.className='gantt-grid';
  grid.style.cssText=`grid-template-columns:${LABEL_W}px repeat(${SPRINTS.length},${SPRINT_W}px);width:${totalW}px;min-height:${totalH}px;`;

  // ── Header row ──
  const corner=document.createElement('div');
  corner.className='gantt-header-corner';
  corner.style.cssText=`height:${ROW_H}px;display:flex;align-items:center;padding:0 12px;background:#fbf9f4;`;
  corner.innerHTML=`<span style="font-size:10px;font-weight:700;color:#5e6058;text-transform:uppercase;letter-spacing:.06em;">Item</span>`;
  // Resize handle on right edge of label column
  const colHandle=document.createElement('div');
  colHandle.style.cssText=`position:absolute;top:0;right:0;width:5px;height:100%;cursor:col-resize;z-index:25;background:transparent;transition:background .15s;`;
  colHandle.addEventListener('mouseenter',()=>colHandle.style.background='rgba(91,95,99,0.2)');
  colHandle.addEventListener('mouseleave',()=>{ if(!colHandle._dragging) colHandle.style.background='transparent'; });
  colHandle.addEventListener('mousedown',e=>{
    e.preventDefault();
    colHandle._dragging=true;
    const startX=e.clientX;
    const startW=appState.ganttLabelW;
    const MIN_W=140, MAX_W=520;
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    const onMove=ev=>{
      const newW=Math.min(MAX_W,Math.max(MIN_W,startW+(ev.clientX-startX)));
      appState.ganttLabelW=newW;
      grid.style.gridTemplateColumns=`${newW}px repeat(${SPRINTS.length},${SPRINT_W}px)`;
      grid.style.width=`${newW+SPRINTS.length*SPRINT_W}px`;
    };
    const onUp=()=>{
      colHandle._dragging=false;
      colHandle.style.background='transparent';
      document.body.style.cursor='';
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
  corner.appendChild(colHandle);
  grid.appendChild(corner);

  SPRINTS.forEach(sp=>{
    const isCur=sp.id===curSpId;
    const th=document.createElement('div');
    th.className='gantt-sprint-header'+(isCur?' current-sprint':'');
    th.style.cssText=`height:${ROW_H}px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 4px;cursor:default;transition:background .15s;`;
    th.innerHTML=`<span style="font-size:10px;font-weight:700;color:${isCur?'#5b5f63':'#5e6058'};white-space:nowrap;">${sp.label}</span>`+
      `<span style="font-size:9px;color:#9e9f95;white-space:nowrap;">${sp.dates}</span>`+
      (isCur?`<span style="width:6px;height:6px;border-radius:50%;background:#5b5f63;margin-top:2px;display:block;"></span>`:'');
    // Milestone chips
    const sprintMilestones=(data.project?.milestones||[]).filter(ms=>{
      if(!ms.date)return false;
      const d=new Date(ms.date); d.setHours(12,0,0,0);
      return d>=sp.start&&d<=sp.end;
    });
    if(sprintMilestones.length){
      const tag=document.createElement('div');
      tag.style.cssText='display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px;';
      sprintMilestones.forEach(ms=>{
        const chip=document.createElement('span');
        chip.style.cssText='font-size:8px;font-weight:700;background:#7a583d;color:white;border-radius:3px;padding:1px 4px;white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis;';
        chip.textContent=ms.name;
        chip.title=`${ms.name}: ${ms.date}`;
        tag.appendChild(chip);
      });
      th.appendChild(tag);
    }
    th.addEventListener('mouseenter',()=>{
      th.style.background=isCur?'#e7e6dd':'#f3f2ec';
      showCapacityTooltip(sp,th);
    });
    th.addEventListener('mouseleave',()=>{
      th.style.background='';
      hideCapacityTooltip();
    });
    grid.appendChild(th);
  });

  // ── Data rows ──
  const typeColor={initiative:'#7a583d',epic:'#57634c',task:'#5b5f63'};
  const typeIcon={initiative:'bolt',epic:'view_quilt',task:'check_box_outline_blank'};
  const rowBg={initiative:'#e8e7df',epic:'#efeee6',task:'white'};

  rows.forEach((rowDef,rowIdx)=>{
    const{item,type,indent}=rowDef;
    const baseRange=appState.compareMode?getItemSprintRangeForScenario(item.id,type,appState.compareBase):null;
    const range=appState.compareMode?getItemSprintRangeForScenario(item.id,type,appState.compareTarget):getItemSprintRange(item.id,type);
    const isSelected=appState.panel.open&&appState.panel.id===item.id;

    // Label cell
    const labelCell=document.createElement('div');
    labelCell.className='gantt-row-label';
    labelCell.style.cssText=`height:${ROW_H}px;display:flex;align-items:center;padding-left:${10+indent*18}px;padding-right:8px;`+
      `background:${isSelected?'rgba(91,95,99,0.08)':rowBg[type]};cursor:pointer;gap:6px;`;
    labelCell.innerHTML=`<span class="material-symbols-outlined" style="font-size:16px;color:${typeColor[type]};flex-shrink:0;">${typeIcon[type]}</span>`+
      `<span style="font-size:12px;font-weight:${type==='task'?500:700};color:#31332c;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${esc(item.summary)}</span>`+
      `<span style="font-size:9px;font-family:monospace;color:#9e9f95;flex-shrink:0;">${esc(item.id)}</span>`;
    if(!locked) labelCell.addEventListener('click',()=>openPanel(type,item.id));
    else labelCell.style.cursor='default';
    grid.appendChild(labelCell);

    // Sprint cells
    SPRINTS.forEach((sp,si)=>{
      const isCurCol=sp.id===curSpId;
      const cell=document.createElement('div');
      cell.className='gantt-cell'+(isCurCol?' current-sprint-col':'');
      cell.style.height=ROW_H+'px';

      // Ghost bar (baseline position in compare mode)
      if(appState.compareMode&&baseRange&&si===baseRange.startIndex){
        const sameAsActive=range&&baseRange.startIndex===range.startIndex&&baseRange.endIndex===range.endIndex;
        if(!sameAsActive){
          const ghostSpan=baseRange.endIndex-baseRange.startIndex+1;
          const ghost=document.createElement('div');
          ghost.className=`gantt-bar gantt-bar--${type}`;
          ghost.style.cssText=`left:10px;width:${ghostSpan*SPRINT_W-20}px;opacity:0.35;cursor:default;pointer-events:none;filter:blur(0.6px);z-index:2;`;
          ghost.textContent=item.summary;
          ghost.title=`Baseline: ${item.id}`;
          cell.appendChild(ghost);
        }
      }
      if(range&&si===range.startIndex){
        const activeRange=range;
        const span=activeRange.endIndex-activeRange.startIndex+1;
        const bar=document.createElement('div');
        bar.className=`gantt-bar gantt-bar--${type}`;
        bar.style.cssText=`left:10px;width:${span*SPRINT_W-20}px;`;
        bar.textContent=item.summary;
        bar.title=`${item.id}: ${item.summary}`;
        if(violatedIds.has(item.id)){
          const warn=document.createElement('span');
          warn.style.cssText='position:absolute;top:1px;right:2px;font-size:8px;font-weight:900;color:#fff;background:rgba(175,50,45,0.92);width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;line-height:1;';
          warn.textContent='!';
          bar.appendChild(warn);
          bar.style.outline='2px solid rgba(175,50,45,0.55)';
          bar.style.outlineOffset='1px';
        }
        if(locked||appState.compareMode){
          bar.style.cursor='default';
          if(locked) bar.style.opacity='0.75';
        } else {
          bar.addEventListener('click',e=>{e.stopPropagation();openPanel(type,item.id);});
          bar.addEventListener('mousedown',e=>{
            const threshold=4;
            const startMX=e.clientX, startMY=e.clientY;
            const onPreMove=mv=>{
              if(Math.abs(mv.clientX-startMX)>threshold||Math.abs(mv.clientY-startMY)>threshold){
                document.removeEventListener('mousemove',onPreMove);
                document.removeEventListener('mouseup',onPreUp);
                startGanttDrag(e,bar,item,type,activeRange,SPRINT_W,LABEL_W,ROW_H,rowIdx);
              }
            };
            const onPreUp=()=>{
              document.removeEventListener('mousemove',onPreMove);
              document.removeEventListener('mouseup',onPreUp);
            };
            document.addEventListener('mousemove',onPreMove);
            document.addEventListener('mouseup',onPreUp);
          });
        }
        ganttBarRegistry.push({id:item.id,type,el:bar});
        cell.appendChild(bar);
        if(!locked&&!appState.compareMode){
          const barW=span*SPRINT_W-20;
          const makeHandle=(side)=>{
            const h=document.createElement('div');
            h.className='gantt-dep-handle';
            h.title=side==='right'?'Drag → to create "blocks" dependency':'Drag ← to create "depends on" dependency';
            h.style.left=(side==='right'?10+barW:10)+'px';
            h.addEventListener('mousedown',e=>{
              e.preventDefault(); e.stopPropagation();
              startDepDraw(item.id,h,side);
            });
            cell.appendChild(h);
          };
          makeHandle('left');
          makeHandle('right');
        }
      } else if(!range&&!baseRange&&si===0){
        const bar=document.createElement('div');
        bar.className='gantt-bar gantt-bar--unscheduled';
        bar.style.cssText=`left:10px;width:${SPRINTS.length*SPRINT_W-20}px;`;
        bar.textContent='Unscheduled';
        cell.appendChild(bar);
      }

      // "+" add-task affordance on hover (not in locked or compare mode)
      if(!locked&&!appState.compareMode){
        const addBtn=document.createElement('div');
        addBtn.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:rgba(91,95,99,0.12);color:#5b5f63;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:16px;line-height:1;z-index:4;transition:background .1s;user-select:none;';
        addBtn.textContent='+';
        addBtn.title=`Add task in ${sp.label}`;
        addBtn.addEventListener('mouseenter',()=>{ addBtn.style.background='rgba(91,95,99,0.22)'; });
        addBtn.addEventListener('mouseleave',()=>{ addBtn.style.background='rgba(91,95,99,0.12)'; });
        addBtn.addEventListener('click',e=>{
          e.stopPropagation();
          // Infer parent epic from row context
          let epicId=null;
          if(type==='epic') epicId=item.id;
          else if(type==='task') epicId=item.epicId||null;
          else if(type==='initiative'){
            const firstEpic=data.epics.find(ep=>ep.initiativeId===item.id);
            epicId=firstEpic?firstEpic.id:null;
          }
          if(appState.scenarioId){
            const scn=data.scenarios.find(s=>s.id===appState.scenarioId);
            if(!scn) return;
            const newTask={
              id:nextId('task'),
              order:scn.tasks.length?Math.max(...scn.tasks.map(t=>t.order))+1:0,
              summary:'New Task',priority:'Medium',assignee:'Unassigned',
              estimate:null,discipline:null,description:'',epicId,
              sprintId:sp.id,
            };
            scn.tasks.push(newTask);
            saveData(); renderRoadmap(); openPanel('task',newTask.id);
          } else {
            const newTask=createItem('task',{summary:'New Task',priority:'Medium',assignee:'Unassigned',estimate:null,discipline:null,description:'',epicId,sprintId:sp.id});
            renderRoadmap(); openPanel('task',newTask.id);
          }
        });
        cell.addEventListener('mouseenter',()=>{ addBtn.style.display='flex'; });
        cell.addEventListener('mouseleave',()=>{ addBtn.style.display='none'; });
        cell.appendChild(addBtn);
      }

      grid.appendChild(cell);
    });
  });

  wrapper.appendChild(grid);

  container.appendChild(wrapper);
  if(locked){
    const wash=document.createElement('div');
    wash.style.cssText=`position:absolute;top:${toolbar.offsetHeight}px;left:0;right:0;bottom:0;background:rgba(251,249,244,0.55);pointer-events:none;z-index:50;`;
    container.appendChild(wash);
  }
  renderDependencyArrows(wrapper,rowIndexMap,ROW_H,SPRINT_W,LABEL_W,rows.length,getActiveDeps(),violatedDepIds);
  // Restore scroll position (use requestAnimationFrame so layout is committed first)
  requestAnimationFrame(()=>{
    wrapper.scrollLeft=savedScrollLeft;
    wrapper.scrollTop=savedScrollTop;
  });
}

function renderDependencyArrows(wrapper,rowIndexMap,ROW_H,SPRINT_W,LABEL_W,rowCount,deps,violatedDepIds=new Set()){
  if(!deps||!deps.length)return;
  const totalW=LABEL_W+SPRINTS.length*SPRINT_W;
  const totalH=ROW_H+rowCount*ROW_H;

  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','gantt-dep-svg');
  svg.setAttribute('width',totalW);
  svg.setAttribute('height',totalH);
  // pointer-events:none on SVG so it doesn't block bar clicks; child hit-paths override this
  svg.style.cssText=`position:absolute;top:0;left:0;pointer-events:none;z-index:5;overflow:visible;`;

  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=
    `<marker id="dep-arrow"           markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="rgba(91,95,99,0.8)"/></marker>`+
    `<marker id="dep-arrow-hover"     markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#5b5f63"/></marker>`+
    `<marker id="dep-arrow-sel"       markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9f403d"/></marker>`+
    `<marker id="dep-arrow-viol"      markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#b53832"/></marker>`+
    `<marker id="dep-arrow-viol-hover" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 Z" fill="#9f3330"/></marker>`;
  svg.appendChild(defs);

  deps.forEach(dep=>{
    const bRes=resolveItemAnyType(dep.toId);
    const dRes=resolveItemAnyType(dep.fromId);
    if(!bRes||!dRes)return;
    const bRowIdx=rowIndexMap[dep.toId];
    const dRowIdx=rowIndexMap[dep.fromId];
    if(bRowIdx===undefined||dRowIdx===undefined)return;
    const bRange=getItemSprintRange(dep.toId,bRes.type);
    const dRange=getItemSprintRange(dep.fromId,dRes.type);
    if(!bRange||!dRange)return;

    const bEndX=LABEL_W+(bRange.endIndex+1)*SPRINT_W-10;
    const dStartX=LABEL_W+dRange.startIndex*SPRINT_W+10;
    const bY=ROW_H+bRowIdx*ROW_H+ROW_H/2;
    const dY=ROW_H+dRowIdx*ROW_H+ROW_H/2;

    let d;
    if(dStartX>bEndX+10){
      const cx=Math.max(40,(dStartX-bEndX)*0.45);
      d=`M${bEndX},${bY} C${bEndX+cx},${bY} ${dStartX-cx},${dY} ${dStartX},${dY}`;
    } else {
      const exitX=bEndX+36;
      const bypassY=Math.max(bY,dY)+ROW_H*0.7;
      const entryX=dStartX-20;
      d=`M${bEndX},${bY}`+
        ` C${exitX},${bY} ${exitX},${bypassY} ${(exitX+entryX)/2},${bypassY}`+
        ` C${entryX},${bypassY} ${entryX},${dY} ${dStartX},${dY}`;
    }

    const isSel=selectedDepId===dep.id;
    const isViol=violatedDepIds.has(dep.id);

    // Visible path
    const visPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    visPath.setAttribute('d',d);
    visPath.setAttribute('fill','none');
    visPath.setAttribute('stroke-linecap','round');
    visPath.setAttribute('pointer-events','none');
    if(isSel){
      visPath.setAttribute('stroke',isViol?'#9f3330':'#9f403d');
      visPath.setAttribute('stroke-width','2.5');
      visPath.setAttribute('stroke-dasharray','6 3');
      visPath.setAttribute('marker-end',`url(#${isViol?'dep-arrow-viol-hover':'dep-arrow-sel'})`);
    } else if(isViol){
      visPath.setAttribute('stroke','#b53832');
      visPath.setAttribute('stroke-width','2');
      visPath.setAttribute('stroke-dasharray','5 3');
      visPath.setAttribute('marker-end','url(#dep-arrow-viol)');
    } else {
      visPath.setAttribute('stroke','rgba(91,95,99,0.55)');
      visPath.setAttribute('stroke-width','1.5');
      visPath.setAttribute('marker-end','url(#dep-arrow)');
    }
    svg.appendChild(visPath);

    // Wide invisible hit path for easy interaction
    const hitPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    hitPath.setAttribute('d',d);
    hitPath.setAttribute('fill','none');
    hitPath.setAttribute('stroke','transparent');
    hitPath.setAttribute('stroke-width','12');
    hitPath.setAttribute('pointer-events','stroke');
    if(!appState.roadmapLocked||appState.scenarioId){
      hitPath.dataset.depHit=dep.id;
      hitPath.style.cursor='pointer';
      hitPath.addEventListener('mouseenter',()=>{
        if(selectedDepId===dep.id)return;
        visPath.setAttribute('stroke',isViol?'#9f3330':'rgba(91,95,99,0.9)');
        visPath.setAttribute('stroke-width','2.5');
        visPath.setAttribute('marker-end',`url(#${isViol?'dep-arrow-viol-hover':'dep-arrow-hover'})`);
      });
      hitPath.addEventListener('mouseleave',()=>{
        if(selectedDepId===dep.id)return;
        if(isViol){
          visPath.setAttribute('stroke','#b53832');
          visPath.setAttribute('stroke-width','2');
          visPath.setAttribute('marker-end','url(#dep-arrow-viol)');
        } else {
          visPath.setAttribute('stroke','rgba(91,95,99,0.55)');
          visPath.setAttribute('stroke-width','1.5');
          visPath.setAttribute('marker-end','url(#dep-arrow)');
        }
      });
      hitPath.addEventListener('click',e=>{
        e.stopPropagation();
        selectedDepId=(selectedDepId===dep.id)?null:dep.id;
        renderRoadmap();
      });
    } else {
      hitPath.setAttribute('pointer-events','none');
    }
    svg.appendChild(hitPath);
  });

  wrapper.appendChild(svg);
}

// SCENARIO NAV

function renderScenarioNavItems(){
  const container=document.getElementById('scenario-nav-items');
  if(!container)return;
  container.innerHTML='';
  const activeC='flex items-center gap-2 px-2 py-1.5 rounded-lg text-xs font-semibold transition-all w-full text-left bg-white text-primary border-l-4 border-primary shadow-sm';
  const inactC='flex items-center gap-2 px-2 py-1.5 rounded-lg text-xs font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600 group';
  data.scenarios.forEach(scn=>{
    const isActive=appState.scenarioId===scn.id;
    const btn=document.createElement('button');
    btn.className=isActive?activeC:inactC;
    btn.innerHTML=`<span class="material-symbols-outlined shrink-0" style="font-size:14px;">fork_right</span><span class="sb-text flex-1 text-left whitespace-nowrap overflow-hidden text-ellipsis">${esc(scn.name)}</span>`+
      `<span class="del-scn-btn sb-text ml-auto opacity-0 group-hover:opacity-100 flex-shrink-0 hover:text-error transition-all" data-scn-id="${esc(scn.id)}" style="line-height:1;">×</span>`;
    if(isActive) btn.querySelector('.del-scn-btn').style.opacity='1';
    btn.addEventListener('click',e=>{
      if(e.target.closest('.del-scn-btn')){e.stopPropagation();deleteScenario(scn.id);return;}
      switchView('scenario',scn.id);
    });
    container.appendChild(btn);
  });
}
