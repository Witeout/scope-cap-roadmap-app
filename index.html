function renderProjectDetails(){
  const container=document.getElementById('project-container');
  if(!container)return;
  const proj=data.project;
  container.innerHTML='';
  container.className='flex flex-col gap-6 p-6 max-w-2xl';

  const card=(title,icon)=>{
    const c=document.createElement('div');
    c.className='bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm';
    const hdr=document.createElement('div');
    hdr.className='flex items-center gap-2 px-4 py-3 border-b border-outline-variant/20 bg-surface-container-low';
    hdr.innerHTML=`<span class="material-symbols-outlined text-slate-500 text-lg">${icon}</span><span class="font-bold text-sm text-on-background">${title}</span>`;
    c.appendChild(hdr);
    const body=document.createElement('div');
    body.className='p-4 flex flex-col gap-4';
    c.appendChild(body);
    container.appendChild(c);
    return body;
  };

  // ── Card 1: Project Timeline ──
  const tlBody=card('Project Timeline','calendar_month');

  const row=(labelText,content)=>{
    const r=document.createElement('div');
    r.className='flex items-center gap-4';
    const lbl=document.createElement('label');
    lbl.className='text-xs font-bold text-slate-500 uppercase tracking-wide w-28 shrink-0';
    lbl.textContent=labelText;
    r.appendChild(lbl);
    r.appendChild(content);
    return r;
  };

  // Start Date
  const startInput=document.createElement('input');
  startInput.type='date'; startInput.value=proj.startDate||'';
  startInput.className='text-sm font-semibold bg-slate-50 border border-outline-variant/30 rounded-lg py-1.5 px-2 focus:outline-none focus:ring-2 focus:ring-primary/20';
  startInput.addEventListener('change',()=>{
    proj.startDate=startInput.value||'2026-01-01';
    saveData(); computeSprints();
  });
  tlBody.appendChild(row('Start Date',startInput));

  // End Date + Ongoing
  const endWrap=document.createElement('div');
  endWrap.className='flex items-center gap-3 flex-1';
  const endInput=document.createElement('input');
  endInput.type='date'; endInput.value=proj.endDate||'';
  endInput.disabled=proj.ongoing;
  endInput.className='text-sm font-semibold bg-slate-50 border border-outline-variant/30 rounded-lg py-1.5 px-2 focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:opacity-40 disabled:cursor-not-allowed';
  endInput.addEventListener('change',()=>{ proj.endDate=endInput.value||null; saveData(); computeSprints(); });
  const ongoingLabel=document.createElement('label');
  ongoingLabel.className='flex items-center gap-1.5 text-sm font-semibold text-slate-600 cursor-pointer select-none whitespace-nowrap';
  const ongoingChk=document.createElement('input');
  ongoingChk.type='checkbox'; ongoingChk.checked=proj.ongoing;
  ongoingChk.className='accent-primary cursor-pointer';
  ongoingChk.addEventListener('change',()=>{
    proj.ongoing=ongoingChk.checked;
    if(proj.ongoing){ proj.endDate=null; endInput.value=''; }
    endInput.disabled=proj.ongoing;
    saveData(); computeSprints();
  });
  ongoingLabel.appendChild(ongoingChk);
  ongoingLabel.appendChild(document.createTextNode('Ongoing'));
  endWrap.appendChild(endInput);
  endWrap.appendChild(ongoingLabel);
  tlBody.appendChild(row('End Date',endWrap));

  // ── Card 2: Milestones ──
  const msBody=card('Major Milestones','flag');

  function renderMilestoneList(){
    msBody.innerHTML='';
    const sorted=[...proj.milestones].sort((a,b)=>a.order-b.order);
    let dragSrc=null;
    sorted.forEach(ms=>{
      const r=document.createElement('div');
      r.className='flex items-center gap-2 mb-2 rounded-lg bg-white border border-outline-variant/20 px-2 py-1.5';
      r.draggable=true;
      r.dataset.msId=ms.id;
      r.addEventListener('dragstart',e=>{ dragSrc=ms; r.style.opacity='0.4'; e.dataTransfer.effectAllowed='move'; });
      r.addEventListener('dragend',()=>{ r.style.opacity=''; dragSrc=null; });
      r.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
      r.addEventListener('drop',e=>{
        e.preventDefault();
        if(!dragSrc||dragSrc.id===ms.id)return;
        const srcOrder=dragSrc.order, tgtOrder=ms.order;
        dragSrc.order=tgtOrder; ms.order=srcOrder;
        saveData(); renderMilestoneList();
      });
      const handle=document.createElement('span');
      handle.className='material-symbols-outlined text-slate-300 text-base cursor-grab select-none';
      handle.textContent='drag_indicator';
      const nameIn=document.createElement('input');
      nameIn.type='text'; nameIn.value=ms.name; nameIn.placeholder='Milestone name';
      nameIn.className='flex-1 text-sm font-semibold bg-transparent border-none outline-none min-w-0';
      nameIn.addEventListener('change',()=>{ ms.name=nameIn.value; saveData(); });
      const dateIn=document.createElement('input');
      dateIn.type='date'; dateIn.value=ms.date||'';
      dateIn.className='text-sm font-semibold bg-slate-50 border border-outline-variant/30 rounded-lg py-1 px-2 focus:outline-none focus:ring-2 focus:ring-primary/20 w-36';
      dateIn.addEventListener('change',()=>{ ms.date=dateIn.value||null; saveData(); });
      const delBtn=document.createElement('button');
      delBtn.innerHTML='<span class="material-symbols-outlined text-base text-slate-300 hover:text-error transition-colors">close</span>';
      delBtn.className='flex-shrink-0';
      delBtn.addEventListener('click',()=>{
        proj.milestones=proj.milestones.filter(m=>m.id!==ms.id);
        saveData(); renderMilestoneList();
      });
      r.appendChild(handle); r.appendChild(nameIn); r.appendChild(dateIn); r.appendChild(delBtn);
      msBody.appendChild(r);
    });

    const addBtn=document.createElement('button');
    addBtn.className='flex items-center gap-1.5 text-sm font-semibold text-primary hover:underline mt-1 self-start';
    addBtn.innerHTML='<span class="material-symbols-outlined text-base">add</span>Add Milestone';
    addBtn.addEventListener('click',()=>{
      data.counters.milestone=(data.counters.milestone||6)+1;
      const maxOrder=proj.milestones.length?Math.max(...proj.milestones.map(m=>m.order))+1:0;
      proj.milestones.push({id:`MS-${data.counters.milestone}`,name:'',date:null,order:maxOrder,fixed:false});
      saveData(); renderMilestoneList();
      setTimeout(()=>{
        const inputs=msBody.querySelectorAll('input[type=text]');
        if(inputs.length) inputs[inputs.length-1].focus();
      },50);
    });
    msBody.appendChild(addBtn);
  }
  renderMilestoneList();

  // ── Card 3: Buffer Management ──
  const bufBody=card('Capacity Buffer','tune');
  const bufDesc=document.createElement('p');
  bufDesc.className='text-sm text-slate-500';
  bufDesc.textContent='Reserves a percentage of total capacity across all disciplines. Affects the capacity tooltip in Roadmap View.';
  bufBody.appendChild(bufDesc);
  const bufRow=document.createElement('div');
  bufRow.className='flex items-center gap-3';
  const bufInput=document.createElement('input');
  bufInput.type='number'; bufInput.min='0'; bufInput.max='100'; bufInput.step='1';
  bufInput.value=proj.bufferPercent||0;
  bufInput.className='w-20 text-sm font-semibold bg-slate-50 border border-outline-variant/30 rounded-lg py-1.5 px-2 focus:outline-none focus:ring-2 focus:ring-primary/20';
  bufInput.addEventListener('change',()=>{
    proj.bufferPercent=Math.max(0,Math.min(100,+bufInput.value||0));
    bufInput.value=proj.bufferPercent;
    saveData();
  });
  const bufLbl=document.createElement('span');
  bufLbl.className='text-sm font-bold text-slate-600';
  bufLbl.textContent='% reserved';
  bufRow.appendChild(bufInput);
  bufRow.appendChild(bufLbl);
  bufBody.appendChild(bufRow);
}

function getScenarioSchedule(scenarioId){
  if(scenarioId===null) return data.tasks.map(t=>({task:t,sprintId:t.sprintId}));
  const scn=data.scenarios.find(s=>s.id===scenarioId);
  if(!scn) return data.tasks.map(t=>({task:t,sprintId:t.sprintId}));
  const allTasks=getScenarioTasks(scn);
  return allTasks.map(t=>{
    const isMain=!!data.tasks.find(x=>x.id===t.id);
    const spId=isMain?(scn.sprintOverrides[t.id]??t.sprintId):t.sprintId;
    return{task:t,sprintId:spId};
  });
}

  const container=document.getElementById('summary-container');

  container.innerHTML='';

  const esc2=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── Card factory ──────────────────────────────────────────────
  const makeCard=(title,icon)=>{
    const c=document.createElement('div');
    c.className='bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm';

    return;
  }

  const selGrid=document.createElement('div');
  selGrid.className='grid grid-cols-2 gap-4';

  const selStyle='w-full text-sm bg-white border border-outline-variant/30 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-primary/20';

  // Base selector (Main Roadmap + all scenarios)
  const baseWrap=document.createElement('div');
  baseWrap.innerHTML=`<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Base</label>`;
  const baseSel=document.createElement('select');
  baseSel.className=selStyle;
  baseSel.innerHTML=`<option value="main">Main Roadmap</option>`+data.scenarios.map(s=>`<option value="${esc2(s.id)}">${esc2(s.name)}</option>`).join('');
  baseSel.value=appState.summaryBase||'main';
  baseWrap.appendChild(baseSel);
  selGrid.appendChild(baseWrap);

  // Target selector (scenarios only)
  const targetWrap=document.createElement('div');
  targetWrap.innerHTML=`<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-1.5">Compare To</label>`;
  const targetSel=document.createElement('select');
  targetSel.className=selStyle;
  targetSel.innerHTML=data.scenarios.map(s=>`<option value="${esc2(s.id)}">${esc2(s.name)}</option>`).join('');
  targetSel.value=appState.summaryTarget||'';
  targetWrap.appendChild(targetSel);

    appState.summaryBase=baseSel.value;
    appState.summaryTarget=targetSel.value||null;
    renderSummaryMetrics(metricsDiv);
  };
  baseSel.addEventListener('change',rebuildMetrics);
  targetSel.addEventListener('change',rebuildMetrics);

}

function renderSummaryMetrics(metricsDiv){
  metricsDiv.innerHTML='';
  const baseId=appState.summaryBase==='main'?null:appState.summaryBase;
  const targetId=appState.summaryTarget;
  if(!targetId){ metricsDiv.innerHTML=`<p class="text-sm text-on-surface-variant">Select a scenario to compare.</p>`; return; }
  if(baseId===targetId){ metricsDiv.innerHTML=`<p class="text-sm text-on-surface-variant">Base and target are the same scenario.</p>`; return; }

  const baseName=baseId?(data.scenarios.find(s=>s.id===baseId)?.name||'Unknown'):'Main Roadmap';
  const targetScn=data.scenarios.find(s=>s.id===targetId);
  const targetName=targetScn?.name||'Unknown';

  const baseSched=getScenarioSchedule(baseId);
  const targetSched=getScenarioSchedule(targetId);

  // Helper: sprint label from id
  const spLabel=spId=>{const sp=SPRINTS.find(s=>s.id===spId);return sp?`${sp.label} (${sp.dates})`:'—';};
  const spIdx=spId=>SPRINTS.findIndex(s=>s.id===spId);

  // ── Card factory local to metricsDiv ──────────────────────────
  const esc2=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const makeCard=(title,icon)=>{
    const c=document.createElement('div');
    c.className='bg-surface-container-low rounded-xl overflow-hidden border border-outline-variant/20 shadow-sm';
    const hdr=document.createElement('div');
    hdr.className='flex items-center gap-2 px-4 py-3 border-b border-outline-variant/20';
    hdr.innerHTML=`<span class="material-symbols-outlined text-slate-500 text-lg">${icon}</span><span class="font-bold text-sm text-on-background">${title}</span>`;
    c.appendChild(hdr);
    const body=document.createElement('div');
    body.className='p-4';
    c.appendChild(body);
    metricsDiv.appendChild(c);
    return body;
  };

  // ── Card 2: Timeline ──────────────────────────────────────────
  const tlBody=makeCard('Timeline','date_range');
  const baseIdxs=baseSched.filter(e=>e.sprintId).map(e=>spIdx(e.sprintId)).filter(i=>i>=0);
  const tgtIdxs=targetSched.filter(e=>e.sprintId).map(e=>spIdx(e.sprintId)).filter(i=>i>=0);
  const bFirst=baseIdxs.length?Math.min(...baseIdxs):-1;
  const bLast=baseIdxs.length?Math.max(...baseIdxs):-1;
  const tFirst=tgtIdxs.length?Math.min(...tgtIdxs):-1;
  const tLast=tgtIdxs.length?Math.max(...tgtIdxs):-1;
  const bSpan=bFirst>=0?bLast-bFirst+1:0;
  const tSpan=tFirst>=0?tLast-tFirst+1:0;

  const rowClass=(a,b)=>a!==b?'bg-tertiary-container/30':'';
  tlBody.innerHTML=`
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">
            <th class="text-left py-1.5 pr-4 font-semibold w-40"></th>
            <th class="text-left py-1.5 pr-4">${esc2(baseName)}</th>
            <th class="text-left py-1.5">${esc2(targetName)}</th>
          </tr>
        </thead>
        <tbody>
          <tr class="${rowClass(bFirst,tFirst)}">
            <td class="py-2 pr-4 text-xs font-semibold text-on-surface-variant">First Sprint</td>
            <td class="py-2 pr-4 text-on-background font-medium">${bFirst>=0?spLabel(SPRINTS[bFirst].id):'No tasks scheduled'}</td>
            <td class="py-2 text-on-background font-medium">${tFirst>=0?spLabel(SPRINTS[tFirst].id):'No tasks scheduled'}</td>
          </tr>
          <tr class="${rowClass(bLast,tLast)}">
            <td class="py-2 pr-4 text-xs font-semibold text-on-surface-variant">Last Sprint</td>
            <td class="py-2 pr-4 text-on-background font-medium">${bLast>=0?spLabel(SPRINTS[bLast].id):'—'}</td>
            <td class="py-2 text-on-background font-medium">${tLast>=0?spLabel(SPRINTS[tLast].id):'—'}</td>
          </tr>
          <tr class="${rowClass(bSpan,tSpan)}">
            <td class="py-2 pr-4 text-xs font-semibold text-on-surface-variant">Sprints Spanned</td>
            <td class="py-2 pr-4 text-on-background font-medium">${bSpan>0?bSpan:'—'}</td>
            <td class="py-2 text-on-background font-medium">${tSpan>0?tSpan:'—'}${tSpan>0&&bSpan>0&&tSpan!==bSpan?`<span class="ml-2 text-xs font-bold ${tSpan>bSpan?'text-tertiary':'text-secondary'}">${tSpan>bSpan?'+':''}${tSpan-bSpan}</span>`:''}</td>
          </tr>
        </tbody>
      </table>
    </div>`;

  // ── Card 3: Task Changes ──────────────────────────────────────
  const chgBody=makeCard('Task Changes','task_alt');
  const baseMap=Object.fromEntries(baseSched.map(e=>[e.task.id,e.sprintId]));
  const tgtMap=Object.fromEntries(targetSched.map(e=>[e.task.id,e.sprintId]));
  const added=data.tasks.filter(t=>!baseMap[t.id]&&tgtMap[t.id]);
  const removed=data.tasks.filter(t=>baseMap[t.id]&&!tgtMap[t.id]);
  const moved=data.tasks.filter(t=>baseMap[t.id]&&tgtMap[t.id]&&baseMap[t.id]!==tgtMap[t.id]);

  const discBadge=d=>d?`<span class="text-[10px] font-bold px-1.5 py-0.5 rounded" style="background:#e8e7df;color:#5e6058;">${esc2(d)}</span>`:'';
  const estBadge=e=>e!=null?`<span class="text-[10px] text-on-surface-variant ml-1">${e}h</span>`:'';

  const taskRow=t=>`<div class="flex items-center gap-2 py-1 border-b border-outline-variant/10 last:border-0"><span class="text-xs text-on-background flex-1 min-w-0 truncate" title="${esc2(t.summary)}">${esc2(t.summary)}</span>${discBadge(t.discipline)}${estBadge(t.estimate)}</div>`;

  // Summary badges
  const summaryRow=document.createElement('div');
  summaryRow.className='flex gap-3 mb-4 flex-wrap';
  const badgeHtml=(n,label,color)=>`<span class="text-xs font-bold px-2.5 py-1 rounded-full" style="background:${color};color:white;">${n} ${label}</span>`;
  summaryRow.innerHTML=
    (added.length?badgeHtml(`+${added.length}`,'added','#57634c'):'')+
    (removed.length?badgeHtml(`−${removed.length}`,'removed','#9f403d'):'')+
    (moved.length?badgeHtml(`↔ ${moved.length}`,'moved','#7a583d'):'')+
    (!added.length&&!removed.length&&!moved.length?`<span class="text-sm text-on-surface-variant">No task schedule changes between these scenarios.</span>`:'');
  chgBody.appendChild(summaryRow);

  if(added.length||removed.length||moved.length){
    const grid=document.createElement('div');
    grid.className='grid gap-4'+(added.length&&removed.length?' grid-cols-2':'');

    if(added.length){
      const col=document.createElement('div');
      col.innerHTML=`<div class="text-xs font-bold text-secondary uppercase tracking-wider mb-2">Added to Schedule</div>`;
      const list=document.createElement('div');
      list.className='text-xs max-h-48 overflow-y-auto';
      list.innerHTML=added.map(taskRow).join('');
      col.appendChild(list);
      grid.appendChild(col);
    }
    if(removed.length){
      const col=document.createElement('div');
      col.innerHTML=`<div class="text-xs font-bold text-error uppercase tracking-wider mb-2">Removed from Schedule</div>`;
      const list=document.createElement('div');
      list.className='text-xs max-h-48 overflow-y-auto';
      list.innerHTML=removed.map(taskRow).join('');
      col.appendChild(list);
      grid.appendChild(col);
    }
    if(moved.length){
      const col=document.createElement('div');
      col.className='col-span-full';
      col.innerHTML=`<div class="text-xs font-bold text-tertiary uppercase tracking-wider mb-2">Moved to Different Sprint</div>`;
      const list=document.createElement('div');
      list.className='text-xs max-h-48 overflow-y-auto';
      list.innerHTML=moved.map(t=>`<div class="flex items-center gap-2 py-1 border-b border-outline-variant/10 last:border-0"><span class="text-xs text-on-background flex-1 min-w-0 truncate" title="${esc2(t.summary)}">${esc2(t.summary)}</span>${discBadge(t.discipline)}<span class="text-[10px] text-on-surface-variant whitespace-nowrap">${spLabel(baseMap[t.id])} → ${spLabel(tgtMap[t.id])}</span></div>`).join('');
      col.appendChild(list);
      grid.appendChild(col);
    }
    chgBody.appendChild(grid);
  }

  // ── Card 4: Scope Delta ───────────────────────────────────────
  const scopeBody=makeCard('Scope Delta','scale');
  const baseEst=baseSched.filter(e=>e.sprintId).reduce((s,e)=>s+(e.task.estimate||0),0);
  const tgtEst=targetSched.filter(e=>e.sprintId).reduce((s,e)=>s+(e.task.estimate||0),0);
  const delta=tgtEst-baseEst;
  const pct=baseEst>0?Math.round(delta/baseEst*100):null;
  const deltaColor=delta>0?'#9f403d':delta<0?'#57634c':'#5e6058';
  const deltaSign=delta>0?'+':'';

  // Top stats row
  const statsRow=document.createElement('div');
  statsRow.className='grid grid-cols-4 gap-3 mb-5';
  const stat=(label,val,color)=>{
    const d=document.createElement('div');
    d.className='bg-white rounded-lg border border-outline-variant/20 p-3 text-center';
    d.innerHTML=`<div class="text-xs font-semibold text-on-surface-variant mb-1">${label}</div><div class="text-lg font-extrabold" style="color:${color||'#31332c'};">${val}</div>`;
    return d;
  };
  statsRow.appendChild(stat(`${esc2(baseName)}`,`${baseEst}h`));
  statsRow.appendChild(stat(`${esc2(targetName)}`,`${tgtEst}h`));
  statsRow.appendChild(stat('Delta',`${deltaSign}${delta}h`,deltaColor));
  statsRow.appendChild(stat('Change',pct!=null?`${deltaSign}${pct}%`:'—',deltaColor));
  scopeBody.appendChild(statsRow);

  // Per-discipline breakdown
  const disciplines=[...new Set(data.tasks.map(t=>t.discipline).filter(Boolean))].sort();
  if(disciplines.length){
    const tbl=document.createElement('table');
    tbl.className='w-full text-sm';
    tbl.innerHTML=`<thead><tr class="text-xs font-bold text-on-surface-variant uppercase tracking-wider border-b border-outline-variant/20">
      <th class="text-left py-1.5">Discipline</th>
      <th class="text-right py-1.5 pr-3">${esc2(baseName)}</th>
      <th class="text-right py-1.5 pr-3">${esc2(targetName)}</th>
      <th class="text-right py-1.5">Delta</th>
    </tr></thead>`;
    const tbody=document.createElement('tbody');
    disciplines.forEach(disc=>{
      const bH=baseSched.filter(e=>e.sprintId&&e.task.discipline===disc).reduce((s,e)=>s+(e.task.estimate||0),0);
      const tH=targetSched.filter(e=>e.sprintId&&e.task.discipline===disc).reduce((s,e)=>s+(e.task.estimate||0),0);
      const d=tH-bH;
      const dc=d>0?'#9f403d':d<0?'#57634c':'#b1b3a9';
      const tr=document.createElement('tr');
      tr.className='border-b border-outline-variant/10 last:border-0';
      tr.innerHTML=`<td class="py-1.5 text-xs font-medium text-on-background">${esc2(disc)}</td><td class="py-1.5 pr-3 text-right text-xs text-on-surface-variant">${bH}h</td><td class="py-1.5 pr-3 text-right text-xs text-on-surface-variant">${tH}h</td><td class="py-1.5 text-right text-xs font-bold" style="color:${dc};">${d!==0?(d>0?'+':'')+d+'h':'—'}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    scopeBody.appendChild(tbl);
  }

  // ── Card 5: Notes ──────────────────────────────────────────────
  const notesBody=makeCard('Update Notes','edit_note');
  const noteKey=`${appState.summaryBase}__${targetId}`;
  const ta=document.createElement('textarea');
  ta.rows=6;
  ta.className='w-full text-sm bg-white border border-outline-variant/30 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-primary/20 resize-y';
  ta.placeholder='Add notes about this comparison — key decisions, risks, stakeholder context...';
  ta.value=data.summaryNotes[noteKey]||'';
  let notesTimer=null;
  ta.addEventListener('input',()=>{
    clearTimeout(notesTimer);
    notesTimer=setTimeout(()=>{ data.summaryNotes[noteKey]=ta.value; saveData(); },400);
  });
  notesBody.appendChild(ta);
}

// ================================================================
// VIEW SWITCHING
// ================================================================
function switchView(view, scenarioId){
  const isScenario=view==='scenario';
  const effectiveView=isScenario?'roadmap':view;
  appState.view=effectiveView;
  appState.scenarioId=isScenario?(scenarioId||null):null;
  if(effectiveView!=='roadmap'){selectedDepId=null;appState.compareMode=false;appState.compareBase=null;appState.compareTarget=null;}
  const isBacklog=effectiveView==='backlog', isSprints=effectiveView==='sprints', isRoadmap=effectiveView==='roadmap', isTeam=effectiveView==='team', isProject=effectiveView==='project', isSummary=effectiveView==='summary';
  const activeC='flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all w-full text-left bg-white text-primary border-l-4 border-primary shadow-sm';
  const inactC='flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-all hover:bg-white/60 w-full text-left text-slate-600';
  document.getElementById('nav-backlog').className=isBacklog?activeC:inactC;
  document.getElementById('nav-team').className=isTeam?activeC:inactC;
  document.getElementById('nav-sprints').className=isSprints?activeC:inactC;
  document.getElementById('nav-roadmap').className=(isRoadmap)?activeC:inactC;
  document.getElementById('nav-project').className=isProject?activeC:inactC;
  document.getElementById('nav-summary').className=isSummary?activeC:inactC;
  document.getElementById('filter-pills').style.display=isBacklog?'':'none';
  document.getElementById('expand-btn').style.display=isBacklog?'':'none';
  document.getElementById('hide-past-btn').style.display=isSprints?'':'none';
  document.getElementById('page-title').textContent={backlog:'Structure View',sprints:'Sprint View',roadmap:'Roadmap',team:'Team',project:'Project Details',summary:'Summary'}[effectiveView]||'Structure View';
  document.getElementById('backlog-card').style.display=(isRoadmap||isTeam||isProject||isSummary)?'none':'';
  document.getElementById('team-container').style.display=isTeam?'block':'none';
  document.getElementById('project-container').style.display=isProject?'block':'none';
  document.getElementById('roadmap-container').style.display=isRoadmap?'flex':'none';
  document.getElementById('summary-container').style.display=isSummary?'block':'none';
  const main=document.querySelector('main');
  const pageHdr=document.getElementById('main-page-header');
  if(isRoadmap){
    main.style.padding='0'; main.style.overflow='hidden'; main.style.display='flex'; main.style.flexDirection='column';
    pageHdr.style.display='none';
  } else {
    main.style.padding=''; main.style.overflow=''; main.style.display=''; main.style.flexDirection='';
    pageHdr.style.display='';
  }
  if(isProject) renderProjectDetails();
  if(isSummary) renderSummary();
  renderScenarioNavItems();
  renderBacklog();
}

function onNewItem(type){
  closeNewDropdown();
  const defaults={
    initiative:{summary:'New Initiative',priority:'Medium',assignee:'Unassigned',description:''},
    epic:      {summary:'New Epic',priority:'Medium',assignee:'Unassigned',description:'',initiativeId:null},

  renderBacklog(); openPanel(type,item.id);

}

// ================================================================
// DELETE
// ================================================================
function showDeleteModal(type,id){
  const item=getItem(type,id);if(!item)return;
  appState.pendingDelete={type,id};
  let msg=`Are you sure you want to delete "${item.summary||item.name}"?`;
  if(type==='initiative'){const n=data.epics.filter(e=>e.initiativeId===id).length;if(n)msg+=` Its ${n} epic${n!==1?'s':''} will be unlinked.`;}
  if(type==='epic'){const n=data.tasks.filter(t=>t.epicId===id).length;if(n)msg+=` Its ${n} task${n!==1?'s':''} will be unlinked.`;}
  document.getElementById('modal-msg').textContent=msg;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function cancelDelete(){appState.pendingDelete=null;document.getElementById('modal-overlay').classList.add('hidden');}
function confirmDelete(){
  if(!appState.pendingDelete)return;
  const{type,id}=appState.pendingDelete;
  if(appState.panel.open&&appState.panel.id===id)closePanel();
  removeItem(type,id); appState.pendingDelete=null;
  document.getElementById('modal-overlay').classList.add('hidden');
  if(type==='member') refreshAssigneesList();
  renderBacklog();
}
document.getElementById('cancel-delete-btn').addEventListener('click',cancelDelete);
document.getElementById('confirm-delete-btn').addEventListener('click',confirmDelete);
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('modal-overlay'))cancelDelete();});

// DROPDOWN
// ================================================================
function closeNewDropdown(){document.getElementById('new-dropdown').classList.add('hidden');}
document.getElementById('new-btn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('new-dropdown').classList.toggle('hidden');});
document.getElementById('new-dropdown').addEventListener('click',e=>{const item=e.target.closest('.dropdown-item');if(!item)return;const a=item.dataset.action;if(a==='new-initiative')onNewItem('initiative');else if(a==='new-epic')onNewItem('epic');else if(a==='new-task')onNewItem('task');});
document.addEventListener('click',e=>{if(!e.target.closest('#new-wrapper'))closeNewDropdown();});

// ================================================================
// DRAG AND DROP
// ================================================================
function onDragStart(e,type,id){
  dragState={type,id,overType:null,overId:null,position:null};
  e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id);
  setTimeout(()=>{const r=document.querySelector(`[data-id="${id}"]`);if(r)r.classList.add('dragging');},0);
}
function clearDropIndicators(){document.querySelectorAll('.drop-above,.drop-below,.drop-inside').forEach(el=>el.classList.remove('drop-above','drop-below','drop-inside'));}
function onDragOver(e,type,id,row){
  if(!dragState||dragState.id===id)return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  clearDropIndicators();
  const canInside=(dragState.type==='task'&&type==='epic')||(dragState.type==='epic'&&type==='initiative');
  const canAlong=dragState.type===type;
  if(!canInside&&!canAlong)return;
  let pos;
  if(canInside){pos='inside';}
  else{const rect=row.getBoundingClientRect();pos=e.clientY<rect.top+rect.height/2?'before':'after';}
  row.classList.add(pos==='inside'?'drop-inside':pos==='before'?'drop-above':'drop-below');
  dragState.overType=type; dragState.overId=id; dragState.position=pos;
}
function onDragLeave(e,row){if(!row.contains(e.relatedTarget))row.classList.remove('drop-above','drop-below','drop-inside');}
function onDrop(e,type,id,row){
  e.preventDefault(); row.classList.remove('drop-above','drop-below','drop-inside');
  if(!dragState||!dragState.overId||dragState.id===dragState.overId){dragState=null;return;}
  const{type:dt,id:di,overType:ot,overId:oi,position:pos}=dragState; dragState=null;
  const dr=document.querySelector(`[data-id="${di}"]`); if(dr)dr.classList.remove('dragging');
  if(pos==='inside'){if(dt==='task'&&ot==='epic')updateItem('task',di,{epicId:oi});else if(dt==='epic'&&ot==='initiative')updateItem('epic',di,{initiativeId:oi});}
  else if(dt===ot){reorder(dt,di,oi,pos);}
  renderBacklog(); renderPanel();
}
function onDragEnd(){clearDropIndicators();document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));dragState=null;}
function onDragOverSprint(e,sprintId,row){if(!dragState||dragState.type!=='task')return;e.preventDefault();clearDropIndicators();row.classList.add('drop-inside');dragState.overType='sprint';dragState.overId=sprintId;dragState.position='inside';}
function onDropSprint(e,sprintId,row){e.preventDefault();row.classList.remove('drop-above','drop-below','drop-inside');if(!dragState||dragState.type!=='task'){dragState=null;return;}const taskId=dragState.id;dragState=null;updateItem('task',taskId,{sprintId:sprintId==='__backlog'?null:sprintId});renderSprintView();}

function reorder(type,dragId,targetId,position){
  const coll=getCollection(type);
  const drag=coll.find(i=>i.id===dragId); const target=coll.find(i=>i.id===targetId);
  if(!drag||!target)return;
  if(type==='task')drag.epicId=target.epicId;
  if(type==='epic')drag.initiativeId=target.initiativeId;
  let siblings;
  if(type==='initiative'){siblings=[...coll].sort((a,b)=>a.order-b.order);}
  else{const pf=type==='task'?'epicId':'initiativeId';siblings=[...coll].filter(i=>i[pf]===drag[pf]).sort((a,b)=>a.order-b.order);}
  const fi=siblings.findIndex(i=>i.id===dragId); if(fi>=0)siblings.splice(fi,1);
  let ti=siblings.findIndex(i=>i.id===targetId); if(ti<0)ti=siblings.length; if(position==='after')ti++;
  siblings.splice(ti,0,drag); siblings.forEach((item,i)=>{item.order=i;}); saveData();
}

// ================================================================
// CONTEXT MENU (right-click sprint assign)
// ================================================================
let ctxMenu=null;
function showContextMenu(e,taskId){
  hideContextMenu();
  const task=getItem('task',taskId); if(!task)return;
  const curSpId=currentSprintId();
  const menu=document.createElement('div'); menu.id='ctx-menu'; ctxMenu=menu;
  const hdr=document.createElement('div'); hdr.className='ctx-header'; hdr.textContent='Assign to Sprint'; menu.appendChild(hdr);
  const listWrap=document.createElement('div'); listWrap.className='ctx-sprint-list';
  const unsched=document.createElement('div');
  unsched.className='ctx-item'+((!task.sprintId)?' ctx-active':'');
  unsched.innerHTML='<span class="ctx-sprint-label">Unscheduled</span>';
  unsched.addEventListener('click',()=>assignSprint(taskId,null)); listWrap.appendChild(unsched);
  const div0=document.createElement('div'); div0.className='ctx-divider'; listWrap.appendChild(div0);
  SPRINTS.forEach(sprint=>{
    const isCurrent=sprint.id===curSpId; const isActive=task.sprintId===sprint.id;
    const item=document.createElement('div'); item.className='ctx-item'+(isActive?' ctx-active':'');
    item.innerHTML=`${isCurrent?'<span class="ctx-current-dot"></span>':'<span style="width:6px;flex-shrink:0"></span>'}<span class="ctx-sprint-label">${sprint.label}</span><span class="ctx-sprint-dates">${sprint.dates}</span>`;
    item.addEventListener('click',()=>assignSprint(taskId,sprint.id)); listWrap.appendChild(item);
  });
  menu.appendChild(listWrap);
  document.body.appendChild(menu);
  const mw=menu.offsetWidth,mh=menu.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  menu.style.left=(e.clientX+mw>vw?vw-mw-8:e.clientX)+'px';
  menu.style.top=(e.clientY+mh>vh?vh-mh-8:e.clientY)+'px';
}
function assignSprint(taskId,sprintId){
  hideContextMenu(); updateItem('task',taskId,{sprintId});
  renderBacklog(); if(appState.panel.open&&appState.panel.id===taskId)renderPanel();
}
function hideContextMenu(){if(ctxMenu){ctxMenu.remove();ctxMenu=null;}}
document.addEventListener('click',hideContextMenu);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('#ctx-menu')&&!e.target.closest('[data-type="task"]'))hideContextMenu();});
// Deselect dependency arrow when clicking anywhere that isn't a hit path
document.addEventListener('click',e=>{
  if(selectedDepId===null||appState.view!=='roadmap') return;
  if(!e.target.dataset||!e.target.dataset.depHit){ selectedDepId=null; renderRoadmap(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ hideContextMenu(); if(selectedDepId){selectedDepId=null;renderRoadmap();} }
  if((e.key==='Delete'||e.key==='Backspace')&&selectedDepId&&appState.view==='roadmap'&&(!appState.roadmapLocked||appState.scenarioId)){
    // Don't fire if an input/textarea is focused
    const tag=document.activeElement&&document.activeElement.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    e.preventDefault();
    removeDependency(selectedDepId);
    selectedDepId=null;
    renderRoadmap();
  }
});
document.addEventListener('scroll',hideContextMenu,true);

// ================================================================
// INIT
// ================================================================
loadData();
renderScenarioNavItems();
renderBacklog();
</script>
